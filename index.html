  const svg = (name, cls='') => `<svg ${cls ? `class="${cls}" ` : ''}xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name] || icons.spark}</svg>`;
  const todayKey = () => {const d = new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
  const dailyIndex = () => {const date = todayKey();let n=0;for(let i=0;i<date.length;i++) n=((n*31)+date.charCodeAt(i))>>>0;return n%DB.trueFalse.length;};
  const dailyQuestion = () => {const previous=saved.daily[todayKey()];
    if(previous && previous.questionId){const found=bank.find(q=>q.id===previous.questionId);if(found)return found;}
    if(previous && !previous.questionId){const q=DB.trueFalse[dailyIndex()];return {id:`archive-${dailyIndex()}`,question:q.statement,answer:q.answer?'Vrai':'Faux',options:['Vrai','Faux'],why:q.why,refs:bank.find(x=>x.id===`archive-${dailyIndex()}`).refs,difficulty:'debutant',topic:'commun'};}
    const dailyBank=bank.filter(q=>q.mode==='truefalse');return dailyBank[(dailyIndex()+new Date().getDate()*7)%dailyBank.length];};
  const dailyPlayed = () => saved.daily[todayKey()];

  const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
  const totalScore = () => saved.discovered.length*15 + saved.results.reduce((acc,x)=>acc+(Number(x.xpEarned) || (Number(x.score)||0)*10),0) + Object.keys(saved.daily).filter(k=>saved.daily[k] && saved.daily[k].correct).length*20;
  const currentLevel = () => Math.floor(totalScore()/180)+1;
  const navItems = [{id:'home',name:'Accueil',icon:'home'},{id:'explore',name:'Explorer les arômes',icon:'explore'},{id:'game',name:'Jouer & apprendre',icon:'game'},{id:'collection',name:'Ma collection',icon:'collection'},{id:'about',name:'À propos',icon:'info'}];
  function navigate(page,opts={}){state.page=page;state.modal=null;if(page==='explore' && opts.filter) state.filter=opts.filter;if(page==='explore' && opts.search!==undefined) state.search=opts.search;render();window.scrollTo({top:0,behavior:'instant'});}
  const navButton = (x, mobile=false) => `<button type="button" data-nav="${x.id}" class="${mobile?'bottom-link':'nav-link'} ${state.page===x.id?'active':''}" ${state.page===x.id?'aria-current="page"':''}>${svg(x.icon)}<span>${mobile?(x.id==='home'?'Accueil':x.id==='explore'?'Arômes':x.id==='game'?'Quiz':x.id==='collection'?'Collection':'Infos'):x.name}</span></button>`;
  function shell(body){return `<div class="app-shell">
    <aside class="sidebar" aria-label="Navigation principale">
      <a href="#" data-nav="home" class="brand" aria-label="AromaLab, accueil"><span class="brand-icon">✳</span><span><span class="brand-name">Aroma<span class="brand-dot">Lab</span></span><div class="brand-sub">Le goût de la découverte</div></span></a>
      <div class="side-label">Découvrir</div><nav class="nav-list">${navItems.map(x=>navButton(x)).join('')}</nav>
      <div class="side-spacer"></div><div class="side-tip"><div class="tip-top">🌿 Le conseil du labo</div><p>Pour exercer ton nez, commence par les odeurs du quotidien. Pas besoin de goûter une boisson !</p><button type="button" data-nav="explore">Explorer les arômes ${svg('right')}</button></div>
      <div class="side-foot">AromaLab · version 1.3 · quiz scientifiques</div>
    </aside><main class="main" id="main-content"><div class="main-wrap">
      <header class="topbar"><div class="topbar-left">Le petit laboratoire des <strong>grandes découvertes.</strong></div><div class="mobile-logo"><span class="brand-icon">✳</span>AromaLab</div><div class="topbar-right"><span class="top-date">${new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(new Date())}</span><span class="top-score" title="Points pédagogiques"> <span class="spark">✦</span> ${totalScore()} pts</span><span class="top-avatar" title="Ton niveau">${currentLevel()}</span></div></header>
      ${body}<div class="footer-note">Fait pour apprendre, sans obligation de consommation. <button type="button" data-nav="about">Sources & confidentialité</button></div>
    </div></main><nav class="bottom-nav" aria-label="Navigation mobile">${navItems.map(x=>navButton(x,true)).join('')}</nav></div>`;}
  const title = (eyebrow,heading,sub) => `<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${heading}</h1><p>${sub}</p></div></div>`;
  function aromaCard(a){const cat=findCat(a.category),fav=saved.favorites.includes(a.id),done=saved.discovered.includes(a.id);return `<article class="aroma-card" role="button" tabindex="0" data-open="${a.id}" aria-label="Découvrir ${safeString(a.name)}"><div class="aroma-art" style="--tile:${cat.pale}"><span class="aroma-emoji" aria-hidden="true">${a.emoji}</span><button type="button" data-favorite="${a.id}" class="card-bookmark ${fav?'saved':''}" aria-label="${fav?'Retirer des favoris':'Ajouter aux favoris'} : ${safeString(a.name)}" title="${fav?'Retirer des favoris':'Ajouter aux favoris'}">${svg('heart')}</button></div><div class="aroma-card-body"><div class="aroma-card-kicker">${cat.name}</div><h3>${safeString(a.name)}</h3><p>${safeString(a.subtitle)}</p><div class="aroma-card-bottom"><span class="molecule-chip" title="${safeString(a.molecule)}">${safeString(a.family)}</span>${done?`<span class="discovered-check">${svg('check')} Trouvé</span>`:''}</div></div></article>`;}
  function featured(){const seed=dailyIndex();return [0,5,11,17].map(i=>aromes[(seed+i)%aromes.length]);}
  function home(){const count=saved.discovered.length;const daily=dailyPlayed();return `<div class="page">
    <section class="hero"><div class="hero-copy"><span class="eyebrow">✦ Bienvenue dans ton labo sensoriel</span><h1>Chaque arôme a <em>une histoire.</em></h1><p>De la banane au poivre noir : explore les odeurs, découvre leur chimie et apprends en jouant. Tout commence avec ton nez.</p><div class="hero-actions"><button class="btn btn-primary" data-nav="explore">Explorer les arômes ${svg('right')}</button><button class="btn btn-outline" data-nav="game">Lancer un quiz ${svg('game')}</button></div></div>
      <div class="hero-art" aria-hidden="true"><div class="orbit-disc"><span class="orbit-glyph">🍷</span></div><span class="bubble bubble-a">🍋</span><span class="bubble bubble-b">🌸</span><span class="bubble bubble-c">🍺</span><span class="bubble bubble-d">🌿</span><span class="floating-label">${aromes.length} arômes à explorer ✦</span></div></section>
    <div class="stats-grid"><div class="stat-card"><div><div class="stat-label">Arômes découverts</div><div class="stat-value">${count}<span style="font-size:16px;color:#abb4a6"> / ${aromes.length}</span></div><div class="stat-hint">dans ta collection</div></div><div class="stat-symbol">🌸</div></div><div class="stat-card"><div><div class="stat-label">Quiz terminés</div><div class="stat-value">${saved.results.length}</div><div class="stat-hint">défis relevés</div></div><div class="stat-symbol gold">🎯</div></div><div class="stat-card"><div><div class="stat-label">Ton niveau</div><div class="stat-value">${currentLevel()}</div><div class="stat-hint">explorateur sensoriel</div></div><div class="stat-symbol pink">✦</div></div></div>
    <section class="section"><div class="section-head"><div><h2 class="section-title">Un petit défi pour aujourd'hui</h2><p class="section-sub">Deux minutes pour apprendre quelque chose de nouveau.</p></div></div><div class="two-col"><div class="surface daily-card"><span class="small-label">${svg('calendar')} Défi du jour · ${todayKey().split('-').reverse().join('/')}</span><div class="daily-visual"><span class="daily-emoji">${daily?'🏅':'🧠'}</span><div><h3>${daily?'Défi accompli !':'Vrai ou faux ?'}</h3><p>${daily?'Tu as déjà répondu à la question du jour. Reviens demain pour la suivante.':'Une question surprise sur les arômes du vin et de la bière. À toi de jouer !'}</p></div></div><div class="daily-bottom"><span class="pill light">${daily?(daily.correct?'✓ Bonne réponse':'✓ Participation enregistrée'):'Une question / jour'}</span><button class="btn btn-primary btn-small" data-nav="daily">${daily?'Voir mon résultat':'Relever le défi'} ${svg('right')}</button></div></div>
      <div class="feature-card"><span class="small-label">✳ Envie d’aller plus loin ?</span><h3>Ton nez est ton meilleur outil.</h3><p>Constitue ta collection en explorant les arômes autour de toi.</p><button class="btn btn-white btn-small" data-nav="collection">Ma collection ${svg('right')}</button></div></div></section>
    <section class="section"><div class="section-head"><div><h2 class="section-title">Ta sélection à sentir</h2><p class="section-sub">Quatre notes à explorer aujourd'hui.</p></div><button class="section-link" data-nav="explore">Voir les ${aromes.length} arômes →</button></div><div class="aroma-grid">${featured().map(aromaCard).join('')}</div></section>
    <section class="section"><div class="section-head"><div><h2 class="section-title">Par quelle famille commencer ?</h2><p class="section-sub">Explore une famille d'odeurs qui t'inspire.</p></div></div>${categoryGrid()}</section>
  </div>`;}
  function categoryGrid(){return `<div class="category-grid">${categories.map(c=>`<button type="button" data-go-category="${c.id}" class="category-tile" style="background:${c.pale}"><span class="cat-emoji">${c.icon}</span><strong>${c.name}</strong><small>${aromes.filter(a=>a.category===c.id).length} arômes</small></button>`).join('')}</div>`;}
  function filteredLibrary(){const search=state.search.trim().toLocaleLowerCase('fr-FR');return aromes.filter(a=>{
    if (state.filter==='favorites' && !saved.favorites.includes(a.id)) return false;
    if (state.filter==='discovered' && !saved.discovered.includes(a.id)) return false;
    if (state.filter!=='all' && !['favorites','discovered'].includes(state.filter) && a.category!==state.filter) return false;
    return !search || [a.name,a.subtitle,a.molecule,a.family,findCat(a.category).name,a.wine,a.beer].some(t=>t.toLocaleLowerCase('fr-FR').includes(search));
  });}
  function libraryGrid(){const list=filteredLibrary();return `<div class="result-info">${list.length} arôme${list.length>1?'s':''} ${list.length===aromes.length?'à découvrir':'dans cette sélection'}</div><div class="aroma-grid">${list.length?list.map(aromaCard).join(''):`<div class="empty-state"><div class="big">🔎</div><h3>Aucun arôme trouvé</h3><p>Essaie une autre recherche ou explore une nouvelle famille d'arômes.</p><button class="btn btn-primary" data-reset-filters>Voir tous les arômes</button></div>`}</div>`;}
  function explore(){return `<div class="page">${title('Bibliothèque aromatique','L’univers des arômes.','${aromes.length} fiches pour relier les odeurs du quotidien aux molécules et aux styles de vins et de bières.')}<div class="tools-bar"><div class="search-row"><label class="search-box">${svg('search')}<input id="aroma-search" class="search-input" type="search" autocomplete="off" placeholder="Rechercher un arôme, une molécule, un vin…" value="${safeString(state.search)}" aria-label="Rechercher parmi les arômes"></label></div><div class="filter-row" aria-label="Filtrer les arômes"><button class="filter-pill ${state.filter==='all'?'selected':''}" data-filter="all">Tous</button>${categories.map(c=>`<button class="filter-pill ${state.filter===c.id?'selected':''}" data-filter="${c.id}"><span>${c.icon}</span>${c.name}</button>`).join('')}<button class="filter-pill ${state.filter==='favorites'?'selected':''}" data-filter="favorites">♡ Favoris</button><button class="filter-pill ${state.filter==='discovered'?'selected':''}" data-filter="discovered">✓ Découverts</button></div></div><div id="library-results">${libraryGrid()}</div><section class="section-note" style="margin-top:25px">💡 Les fiches présentent des molécules <strong>associées</strong> à des descripteurs, et non des correspondances exclusives. La perception d’une boisson résulte de mélanges complexes.</section></div>`;}
  function quizModes(){
    const modes=[
      {mode:'aroma',emoji:'👃',title:'Devine l’arôme',desc:'Identifie un descripteur à partir d’une molécule aromatique.',meta:'8 questions · 60 associations'},
      {mode:'molecule',emoji:'🧬',title:'Molécule mystère',desc:'Relie les familles aromatiques aux composés étudiés.',meta:'8 questions · Chimie'},
      {mode:'science',emoji:'🔬',title:'Le labo scientifique',desc:'Fermentation, défauts, terpènes, arômes de vin et de bière.',meta:'8 questions · Connaissances'},
      {mode:'truefalse',emoji:'⚖️',title:'Mythe ou science ?',desc:'Débusque les idées reçues et vérifie ton raisonnement.',meta:'8 questions · Vrai / faux'}
    ];
    const pill=(attr,value,label,current)=>`<button type="button" ${attr}="${value}" aria-pressed="${current===value}">${label}</button>`;
    const controls=`<div class="quiz-controls"><div class="quiz-control-panel"><div class="quiz-control-title">Niveau</div><div class="segmented-choices">${[['toutes','Tous'],['debutant','Découverte'],['intermediaire','Intermédiaire'],['expert','Expert']].map(x=>pill('data-quiz-difficulty',x[0],x[1],state.settings.difficulty)).join('')}</div></div><div class="quiz-control-panel"><div class="quiz-control-title">Univers</div><div class="segmented-choices">${[['mixte','Les deux'],['vin','Vin'],['biere','Bière']].map(x=>pill('data-quiz-theme',x[0],x[1],state.settings.theme)).join('')}</div></div></div>`;
    return `<div class="quiz-summary-banner">🌿 ${totalQuestions} questions issues de fiches et de références scientifiques · 4 modes · 3 niveaux</div>${controls}<div class="quiz-modes">${modes.map((m,i)=>`<button class="mode-card" data-start-quiz="${m.mode}"><span class="mode-icon" style="background:${['#eef2e2','#f7ece5','#eaf1ea','#eee9f5'][i]}">${m.emoji}</span><h3>${m.title}</h3><p>${m.desc}</p><span class="mode-meta">${m.meta}</span><span class="mode-cta">Commencer ${svg('right')}</span></button>`).join('')}</div>`;
  }
  function buildQuiz(mode){
    let pool=rand(bank.filter(q=>q.mode===mode && quizFilter(q)));
    // Si le filtre combiné est trop étroit, on complète avec d'autres thèmes,
    // en gardant le niveau choisi (sans dupliquer les identifiants).
    if(pool.length<8){const seen=new Set(pool.map(q=>q.id));for(const q of rand(bank.filter(q=>q.mode===mode && (state.settings.difficulty==='toutes'||q.difficulty===state.settings.difficulty)))){if(!seen.has(q.id)){pool.push(q);seen.add(q.id);}if(pool.length>=8)break;}}
    if(pool.length<8){const seen=new Set(pool.map(q=>q.id));for(const q of rand(bank.filter(q=>q.mode===mode))){if(!seen.has(q.id)){pool.push(q);seen.add(q.id);}if(pool.length>=8)break;}}
    const items=pool.slice(0,8).map(q=>({...q,options:rand(q.options)}));
    return {mode,items,idx:0,selected:null,score:0,answers:[],done:false,recorded:false,settings:{...state.settings}};
  }
  function currentQuiz(){
    const q=state.quiz;if(!q)return quizModes();if(q.done)return quizResults(q);
    const question=q.items[q.idx];
    return `<div class="quiz-panel"><div class="quiz-head"><button class="btn btn-quiet btn-small" data-exit-quiz>${svg('left')} Changer de jeu</button><span class="quiz-count">Question ${q.idx+1} / ${q.items.length}</span></div><div class="progress-track" aria-label="Progression du quiz"><div class="progress-fill" style="width:${100*(q.idx+(q.selected!==null?1:0))/q.items.length}%"></div></div><div class="quiz-meta-line">${safeString(difficultyLabels[question.difficulty])} · ${safeString(topicLabels[question.topic])} · +${scoreMultiplier(question)} XP si réussi</div><div class="question-kicker">✦ ${question.mode==='science'?'Le labo scientifique':question.mode==='aroma'?'Devine l’arôme':question.mode==='molecule'?'Molécule mystère':'Mythe ou science ?'}</div><h2 class="quiz-question">${safeString(question.question)}</h2><div class="quiz-choices">${question.options.map((option,i)=>`<button class="choice ${q.selected===null?'':(option===question.answer?'correct':q.selected===option?'wrong':'')}" data-quiz-option="${safeString(option)}" ${q.selected!==null?'disabled':''}><span class="choice-letter">${'ABCD'[i]}</span><span>${safeString(option)}</span>${q.selected!==null && option===question.answer?svg('check'):''}</button>`).join('')}</div>${q.selected!==null?`<div class="answer-panel ${q.selected===question.answer?'':'wrong'}" role="status"><strong>${q.selected===question.answer?'✓ Bonne réponse !':'↗ À retenir : '+safeString(question.answer)}</strong><p>${safeString(question.why)}</p>${quizSources(question.refs)}</div><div class="answer-actions"><button class="btn btn-primary" data-next-question>${q.idx===q.items.length-1?'Voir mon score':'Question suivante'} ${svg('right')}</button></div>`:''}</div>`;
  }
  function quizResults(q){
    const pct=Math.round(100*q.score/q.items.length),earned=q.xpEarned??quizXP(q);
    const msg=pct>=88?'Quel nez de scientifique !':pct>=63?'Très beau travail !':pct>=38?'Tu progresses à chaque question.':'Chaque erreur est une découverte.';
    const modeNames={aroma:'Devine l’arôme',molecule:'Molécule mystère',science:'Le labo scientifique',truefalse:'Mythe ou science ?'};
    const wrong=q.items.filter((item,i)=>q.answers[i]!==item.answer);
    return `<div class="quiz-panel quiz-result"><div class="trophy">${pct>=75?'🏆':pct>=40?'🌟':'🌱'}</div><span class="eyebrow">Mission accomplie</span><h2>${msg}</h2><div class="result-number">${q.score}<span> / ${q.items.length}</span></div><p>${safeString(modeNames[q.mode])} · ${safeString(q.settings.difficulty==='toutes'?'Niveaux variés':difficultyLabels[q.settings.difficulty])} · <strong>+${earned} XP</strong></p><div class="result-buttons"><button class="btn btn-outline" data-exit-quiz>Choisir un jeu</button><button class="btn btn-primary" data-start-quiz="${q.mode}">${svg('refresh')} Rejouer</button><button class="btn btn-light" data-share-score>${svg('share')} Partager</button></div>${wrong.length?`<div class="section-note" style="text-align:left;margin-top:24px"><strong>À revoir (${wrong.length}) :</strong>${wrong.slice(0,5).map(w=>`<p style="margin:9px 0 0">• ${safeString(w.question)}<br><strong>${safeString(w.answer)}</strong></p>`).join('')}</div>`:'<p>Sans faute ! Toutes les réponses sont correctes.</p>'}</div>`;
  }
  function game(){return `<div class="page">${title('Atelier interactif','Apprendre en jouant.','Quatre modes, trois difficultés et des corrections appuyées sur les publications scientifiques de la bibliothèque.')} ${currentQuiz()} <section class="section"><div class="section-head"><div><h2 class="section-title">Ton parcours de scientifique</h2><p class="section-sub">${saved.results.length} quiz terminés · ${avgPercent()} % de bonnes réponses au total</p></div></div><div class="science-quiz-statgrid"><div class="science-quiz-stat"><strong>${totalScore()}</strong><small>XP cumulés</small></div><div class="science-quiz-stat"><strong>${currentLevel()}</strong><small>Niveau actuel</small></div><div class="science-quiz-stat"><strong>${currentStreak()}</strong><small>Jours de défis consécutifs</small></div></div><div class="section-note">🧠 Les associations proposées constituent des exemples documentés, jamais des règles absolues. Tu peux apprendre sans consommer d’alcool.</div></section></div>`;}
  function daily(){const q=dailyQuestion(),answered=dailyPlayed();return `<div class="page">${title('Ton rendez-vous quotidien','Le défi du jour.','Une question sourcée par jour pour garder la curiosité en éveil.')}<div class="quiz-panel"><div class="quiz-head"><button class="btn btn-quiet btn-small" data-nav="home">${svg('left')} Retour à l’accueil</button><span class="pill light">${svg('calendar')} ${todayKey().split('-').reverse().join('/')}</span></div><div class="question-kicker">✦ Vrai ou faux ? · ${difficultyLabels[q.difficulty]}</div><h2 class="quiz-question">${safeString(q.question)}</h2><div class="quiz-choices">${['Vrai','Faux'].map(choice=>`<button class="choice ${answered?(choice===q.answer?'correct':String(answered.answer)===choice?'wrong':''):''}" data-daily-answer="${choice}" ${answered?'disabled':''}><span class="choice-letter">${choice==='Vrai'?'V':'F'}</span>${choice}</button>`).join('')}</div>${answered?`<div class="answer-panel ${answered.correct?'':'wrong'}"><strong>${answered.correct?'✓ Bonne réponse !':'↗ La réponse était : '+q.answer}</strong><p>${safeString(q.why)}</p>${quizSources(q.refs)}</div><div class="answer-actions"><button class="btn btn-outline" data-nav="game">Explorer les autres quiz ${svg('right')}</button></div>`:`<div class="section-note" style="margin-top:22px">🌿 +20 XP en cas de bonne réponse. Tu peux répondre sans goûter de boisson alcoolisée.</div>`}</div></div>`;}
  function achievements(){const c=saved.discovered.length,n=saved.results.length,d=Object.keys(saved.daily).length;return [
    {emoji:'🌱',name:'Premier pas',desc:'1 arôme découvert',ok:c>=1},
    {emoji:'👃',name:'Nez curieux',desc:'5 arômes découverts',ok:c>=5},
    {emoji:'🧪',name:'Apprenti chimiste',desc:'12 arômes découverts',ok:c>=12},
    {emoji:'🏆',name:'Maître des arômes',desc:'60 arômes découverts',ok:c>=60},
    {emoji:'🎯',name:'Premier quiz',desc:'1 quiz terminé',ok:n>=1},
    {emoji:'🧠',name:'Scientifique régulier',desc:'10 quiz terminés',ok:n>=10},
    {emoji:'🔬',name:'Expert du labo',desc:'3 quiz à 100 %',ok:saved.results.filter(r=>r.score===r.total).length>=3},
    {emoji:'🌞',name:'À demain !',desc:'3 défis du jour réalisés',ok:d>=3},
    {emoji:'🔥',name:'Série aromatique',desc:'5 jours de défis consécutifs',ok:currentStreak()>=5},
    {emoji:'✨',name:'Grand explorateur',desc:'Niveau 10 atteint',ok:currentLevel()>=10}
  ];}
  function quizStatistics(){const done=saved.results.length;const totalAnswers=saved.results.reduce((n,r)=>n+(Number(r.total)||8),0);const correct=saved.results.reduce((n,r)=>n+(Number(r.score)||0),0);
    const labels={aroma:'Arômes',molecule:'Molécules',science:'Science',truefalse:'Vrai / Faux'};
    return `<section class="section"><div class="section-head"><div><h2 class="section-title">Mes statistiques de quiz</h2><p class="section-sub">Suis tes progrès et les sujets à réviser.</p></div></div><div class="science-quiz-statgrid"><div class="science-quiz-stat"><strong>${done}</strong><small>Parties jouées</small></div><div class="science-quiz-stat"><strong>${totalAnswers?Math.round(100*correct/totalAnswers):0}%</strong><small>Réponses correctes</small></div><div class="science-quiz-stat"><strong>${currentStreak()} j</strong><small>Série quotidienne</small></div></div><div class="surface" style="padding:20px;border-radius:20px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><strong>Niveau ${currentLevel()}</strong><span style="font-size:12px;color:var(--muted)">${nextLevelPoints()} XP avant le niveau ${currentLevel()+1}</span></div><div class="level-meter" role="progressbar" aria-valuemin="0" aria-valuemax="180" aria-valuenow="${totalScore()%180}"><span style="width:${(totalScore()%180)/180*100}%"></span></div>${Object.entries(labels).map(([key,label])=>{const items=saved.results.filter(r=>r.mode===key);const total=items.reduce((s,r)=>s+(Number(r.total)||8),0),ok=items.reduce((s,r)=>s+(Number(r.score)||0),0),pct=total?Math.round(100*ok/total):0;return `<div class="category-progress"><span>${label}</span><div class="bar"><i style="width:${pct}%"></i></div><em>${pct}%</em></div>`;}).join('')}<p style="font-size:12px;color:var(--muted);margin-bottom:0">Les pourcentages tiennent compte des parties enregistrées sur cet appareil.</p></div></section>`;
  }
  function collection(){const done=aromes.filter(a=>saved.discovered.includes(a.id));const fav=aromes.filter(a=>saved.favorites.includes(a.id));const pct=100*done.length/aromes.length;return `<div class="page">${title('Ton carnet personnel','Ma collection.','Garde la trace des arômes que tu as identifiés dans la vie quotidienne et retrouve tes favoris.')}<div class="collection-top"><div><span class="eyebrow">✦ Mon parcours</span><h2>${done.length===aromes.length?'Collection complète !':'Chaque découverte compte.'}</h2><p>${done.length} arôme${done.length>1?'s':''} repéré${done.length>1?'s':''} sur ${aromes.length}. Ouvre une fiche et coche « Je l’ai senti » pour l’ajouter ici.</p></div><div class="round-meter" style="--pct:${pct}%"><div class="meter-inner"><strong>${Math.round(pct)} %</strong><span>complété</span></div></div></div>
    ${quizStatistics()}<section class="section"><div class="section-head"><div><h2 class="section-title">Mes badges</h2><p class="section-sub">Ils se débloquent en explorant et en jouant.</p></div></div><div class="achievement-grid">${achievements().map(a=>`<div class="achievement ${a.ok?'earned':''}"><div class="achievement-icon">${a.ok?a.emoji:'🔒'}</div><div><strong>${a.name}</strong><span>${a.desc}</span></div></div>`).join('')}</div></section>
    <section class="section"><div class="section-head"><div><h2 class="section-title">Arômes déjà découverts</h2><p class="section-sub">${done.length} / ${aromes.length} trouvés.</p></div><button class="section-link" data-nav="explore">Tout explorer →</button></div><div class="aroma-grid">${done.length?done.map(aromaCard).join(''):`<div class="empty-state"><div class="big">🌱</div><h3>Ton aventure commence ici</h3><p>Commence par une odeur simple : le citron, le café ou une banane mûre. Ouvre ensuite sa fiche et marque-la comme découverte.</p><button class="btn btn-primary" data-nav="explore">Découvrir les arômes ${svg('right')}</button></div>`}</div></section>
    <section class="section"><div class="section-head"><div><h2 class="section-title">Mes favoris</h2><p class="section-sub">Tes références à retrouver en un clin d’œil.</p></div></div><div class="aroma-grid">${fav.length?fav.map(aromaCard).join(''):`<div class="empty-state"><div class="big">♡</div><h3>Pas encore de favoris</h3><p>Touche le cœur d’une fiche pour enregistrer tes arômes préférés.</p><button class="btn btn-outline" data-nav="explore">Explorer la bibliothèque</button></div>`}</div></section>
    <section class="section"><div class="section-note">🔒 Tes découvertes, quiz et notes restent <strong>sur cet appareil, dans ce navigateur</strong>. Elles ne sont pas synchronisées avec un compte. Effacer les données du navigateur peut les supprimer.</div></section></div>`;}
  function about(){return `<div class="page">${title('À propos du projet','Un labo dans ta poche.','Une porte d’entrée ludique vers les odeurs, la chimie des arômes et la dégustation sensorielle.')}<div class="about-layout"><section class="surface about-card"><h2>La science derrière AromaLab</h2><p>Chaque fiche fait le lien entre une <strong>odeur reconnaissable</strong>, un <strong>composé parfois associé</strong> et des exemples d’expression dans le vin ou la bière.</p><p>La réalité est plus nuancée : un même descripteur peut résulter d’un mélange de molécules, et l’effet sensoriel dépend de leur concentration, du produit et de la sensibilité individuelle. Les exemples sont indicatifs et ne constituent pas des règles absolues. Les fiches citées s’appuient sur des études et revues scientifiques vérifiables ; une citation ne signifie pas que chaque combinaison molécule–boisson a été démontrée expérimentalement par la même étude. Les seuils varient selon la matrice et ne sont donc pas chiffrés ici sans contexte expérimental.</p><div class="about-info"><strong>🌿 Apprendre sans consommer</strong><p>Les défis olfactifs utilisent des produits alimentaires ou végétaux du quotidien. Tu n’as pas besoin de boire d’alcool. Ne sens jamais de produits chimiques, de solvants ou de fumées volontairement pour réaliser un exercice.</p></div><div class="about-info"><strong>🔒 Respect de tes données</strong><p>Pas de compte, pas de publicité, pas de serveur de suivi : les favoris, notes et scores sont enregistrés localement dans ce navigateur. Tu peux supprimer ces données à tout moment.</p><button class="btn btn-outline btn-small" style="margin-top:12px" data-clear-data>${svg('trash')} Effacer mes données</button></div><div class="about-info"><strong>📱 Installer AromaLab</strong><p>Une fois le site publié en HTTPS, ouvre-le dans ton navigateur et choisis « Ajouter à l’écran d’accueil » ou « Installer l’application ». L’installation varie selon l’appareil.</p><button class="btn btn-primary btn-small" style="margin-top:12px" data-install>Installer si disponible ${svg('right')}</button></div></section>
    <section class="surface about-card"><h2>Sources scientifiques</h2><p>Références scientifiques vérifiables (articles et revues à comité de lecture), avec une ressource universitaire complémentaire. Chaque fiche renvoie aux études pertinentes ; les liens nécessitent Internet.</p>${DB.sources.map(s=>`<div class="source-item"><a href="${safeString(s.url)}" target="_blank" rel="noopener noreferrer">${safeString(s.title)} ↗</a><p>${safeString(s.info)}</p></div>`).join('')}</section></div></div>`;}
  function detailModal(a){if(!a)return '';const cat=findCat(a.category),done=saved.discovered.includes(a.id),fav=saved.favorites.includes(a.id),note=typeof saved.notes[a.id]==='string'?saved.notes[a.id]:'';return `<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="icon-button modal-close" data-close-modal aria-label="Fermer la fiche">${svg('x')}</button><div class="modal-hero" style="--tile:${cat.pale}"><div class="modal-emoji" aria-hidden="true">${a.emoji}</div><div class="modal-hero-text"><span class="eyebrow">${cat.icon} ${cat.name}</span><h2 id="modal-title">${safeString(a.name)}</h2><p>${safeString(a.subtitle)}</p></div></div><div class="modal-content"><p class="modal-intro">Découvre cette note, son origine possible et les contextes où elle peut se manifester.</p><div class="modal-feature"><div class="tiny">🧬 Molécule associée</div><strong>${safeString(a.molecule)}</strong><small>${safeString(a.family)} · Exemple de composé, pas une origine exclusive</small></div>
    <div class="detail-columns"><div class="detail-block"><div class="detail-label">${svg('flask')} D’où vient-elle ?</div><p>${safeString(a.origin)}</p></div><div class="detail-block"><div class="detail-label">${svg('explore')} Au quotidien</div><p>${safeString(a.everyday)}</p></div><div class="detail-block"><div class="detail-label">${svg('wine')} Dans le vin</div><p>${safeString(a.wine)}</p></div><div class="detail-block"><div class="detail-label">${svg('beer')} Dans la bière</div><p>${safeString(a.beer)}</p></div></div>
    <div class="insight"><h4>✦ La minute science</h4><p>${safeString(a.insight)}</p></div><div class="sniff-box"><h4>👃 Le défi olfactif</h4><p>${safeString(a.sniff)}</p></div>
    <div style="margin-top:22px"><label class="small-label" for="aroma-note">✎ Mes impressions personnelles</label><textarea id="aroma-note" class="note-area" maxlength="1000" placeholder="Ex. : senti dans un zeste frais, très intense…">${safeString(note)}</textarea></div>
    <div class="modal-actions"><button class="btn ${done?'btn-light':'btn-primary'}" data-discover="${a.id}">${svg('check')} ${done?'Déjà senti ✓':'Je l’ai senti !'}</button><button class="btn ${fav?'btn-light':'btn-outline'}" data-detail-fav="${a.id}">${svg('heart')} ${fav?'En favori ♥':'Ajouter aux favoris'}</button><button class="btn btn-light" data-save-note="${a.id}">Enregistrer ma note</button></div>
    <div class="modal-sources">Publications scientifiques associées : ${a.sources.map(id=>{const s=DB.sources.find(x=>x.id===id);return s?`<a href="${safeString(s.url)}" target="_blank" rel="noopener noreferrer">${safeString(s.title)} ↗</a>`:'';}).join('')}</div>
  </div></section></div>`;}
  function render(){let body;switch(state.page){case 'explore':body=explore();break;case 'game':body=game();break;case 'collection':body=collection();break;case 'about':body=about();break;case 'daily':body=daily();break;default:body=home();}app.innerHTML=shell(body)+(state.modal?detailModal(findAroma(state.modal)):'');document.body.style.overflow=state.modal?'hidden':'';if(state.modal)app.querySelector('.modal-close')?.focus();}
  let toastTimer;
  function notify(message){document.querySelector('.toast')?.remove();const div=document.createElement('div');div.className='toast';div.setAttribute('role','status');div.textContent=message;document.body.append(div);clearTimeout(toastTimer);toastTimer=setTimeout(()=>div.remove(),2700);}
  function toggleFavorite(id){saved.favorites=saved.favorites.includes(id)?saved.favorites.filter(x=>x!==id):[...saved.favorites,id];persist();render();notify(saved.favorites.includes(id)?'Ajouté aux favoris ♡':'Retiré des favoris');}
  function toggleDiscovered(id){saved.discovered=saved.discovered.includes(id)?saved.discovered.filter(x=>x!==id):[...saved.discovered,id];persist();render();notify(saved.discovered.includes(id)?'Une nouvelle découverte dans ta collection !':'Arôme retiré de la collection');}
  function nextQuestion(){const q=state.quiz;if(!q || q.selected===null)return;if(q.idx===q.items.length-1){q.done=true;q.xpEarned=quizXP(q);if(!q.recorded){saved.results.push({mode:q.mode,score:q.score,total:q.items.length,date:Date.now(),difficulty:q.settings.difficulty,theme:q.settings.theme,xpEarned:q.xpEarned});saved.results=saved.results.slice(-80);q.recorded=true;persist();}}else{q.idx++;q.selected=null;}render();}
  const shareScore = async () => {if(!state.quiz)return;const text=`J'ai obtenu ${state.quiz.score}/${state.quiz.items.length} au quiz AromaLab 🌿🧪 ! Découvre les ${totalQuestions} questions scientifiques : https://dinlisa.github.io/Aromalab/`;try {if(navigator.share){await navigator.share({title:'AromaLab',text});notify('Partage prêt !');return;}if(navigator.clipboard && window.isSecureContext){await navigator.clipboard.writeText(text);notify('Score copié !');return;}const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();notify(ok?'Score copié !':'Copie non disponible.');}catch(e){if(e.name!=='AbortError')notify('Partage indisponible sur cet appareil.');}};
  document.addEventListener('click',async event=>{
    const el=event.target.closest('[data-nav],[data-go-category],[data-filter],[data-open],[data-favorite],[data-detail-fav],[data-close-modal],[data-discover],[data-save-note],[data-reset-filters],[data-start-quiz],[data-quiz-difficulty],[data-quiz-theme],[data-exit-quiz],[data-quiz-option],[data-next-question],[data-daily-answer],[data-share-score],[data-install],[data-clear-data]');
    if(!el)return;
    if(el.matches('[data-favorite]')){event.stopPropagation();toggleFavorite(el.dataset.favorite);return;}
    if(el.matches('[data-detail-fav]')){toggleFavorite(el.dataset.detailFav);return;}
    if(el.matches('[data-close-modal]')){if(el.classList.contains('modal-backdrop')&&event.target!==el)return;state.modal=null;render();return;}
    if(el.matches('[data-discover]')){toggleDiscovered(el.dataset.discover);return;}
    if(el.matches('[data-save-note]')){const t=document.getElementById('aroma-note');saved.notes[el.dataset.saveNote]=t?t.value.trim():'';persist();notify('Ta note est enregistrée sur cet appareil.');return;}
    if(el.matches('[data-open]')){state.modal=el.dataset.open;render();return;}
    if(el.matches('[data-go-category]')){state.search='';navigate('explore',{filter:el.dataset.goCategory});return;}
    if(el.matches('[data-filter]')){state.filter=el.dataset.filter;render();return;}
    if(el.matches('[data-reset-filters]')){state.filter='all';state.search='';render();return;}
    if(el.matches('[data-quiz-difficulty]')){state.settings.difficulty=el.dataset.quizDifficulty;render();return;}
    if(el.matches('[data-quiz-theme]')){state.settings.theme=el.dataset.quizTheme;render();return;}
    if(el.matches('[data-start-quiz]')){state.quiz=buildQuiz(el.dataset.startQuiz);state.page='game';render();window.scrollTo({top:0,behavior:'instant'});return;}
    if(el.matches('[data-exit-quiz]')){state.quiz=null;render();return;}
    if(el.matches('[data-quiz-option]')){const q=state.quiz;if(!q||q.selected!==null)return;q.selected=el.dataset.quizOption;if(q.selected===q.items[q.idx].answer)q.score++;q.answers[q.idx]=q.selected;render();return;}
    if(el.matches('[data-next-question]')){nextQuestion();return;}
    if(el.matches('[data-daily-answer]')){if(dailyPlayed())return;const answer=el.dataset.dailyAnswer;const dailyQ=dailyQuestion();saved.daily[todayKey()]={answer,correct:answer===dailyQ.answer,questionId:dailyQ.id};persist();render();return;}
    if(el.matches('[data-share-score]')){await shareScore();return;}
    if(el.matches('[data-install]')){if(deferredInstall){await deferredInstall.prompt();deferredInstall=null;}else notify('Utilise le menu de ton navigateur : « Ajouter à l’écran d’accueil ».');return;}
    if(el.matches('[data-clear-data]')){if(confirm('Effacer définitivement tes notes, favoris, découvertes et scores sur cet appareil ?')){saved=emptyStore();persist();state.quiz=null;render();notify('Données locales effacées.');}return;}
    if(el.matches('[data-nav]')){event.preventDefault();navigate(el.dataset.nav);return;}
  });
  document.addEventListener('input',event=>{
    if(event.target.id==='aroma-note' && state.modal){saved.notes[state.modal]=event.target.value;persist();return;}
    if(event.target.id!=='aroma-search')return;
    state.search=event.target.value;
    const container=document.getElementById('library-results');if(container)container.innerHTML=libraryGrid();
  });
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&state.modal){state.modal=null;render();return;}
    if(event.key==='Tab'&&state.modal){
      const modal=document.querySelector('.modal');
      if(modal){const focusables=[...modal.querySelectorAll('button:not(:disabled),a[href],textarea,input')];if(focusables.length){const first=focusables[0],last=focusables[focusables.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}}
    }
    if((event.key==='Enter'||event.key===' ')&&event.target.matches('.aroma-card')){event.preventDefault();state.modal=event.target.dataset.open;render();}
  });
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;});
  // Application autonome : le contenu et les quiz restent intégrés à ce HTML.
  render();
})();

</script>
<script>
// Enregistrement non bloquant : si le service worker échoue, AromaLab fonctionne quand même.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .catch(error => console.warn('Mode hors ligne indisponible :', error));
  });
}
</script>
</body></html>
