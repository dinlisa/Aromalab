<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="theme-color" content="#193f32"><meta name="description" content="Découvre les arômes du vin et de la bière avec AromaLab : fiches, quiz et défis sensoriels."><link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="AromaLab">
<title>AromaLab — Le goût de la découverte</title><style>
:root {
  --bg:#f7f7f2;
  --paper:#fffefa;
  --ink:#203329;
  --muted:#748075;
  --primary:#214b3a;
  --primary-deep:#153b2d;
  --lime:#d6e5b3;
  --accent:#e6b381;
  --line:#e7eae1;
  --shadow:0 12px 40px rgba(34,60,46,.045);
  --radius:22px;
  --font:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --serif:Georgia,'Times New Roman',serif
}


* {
  box-sizing:border-box
}

html {
  scroll-behavior:smooth
}

body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased
}

button,input,textarea {
  font:inherit
}

button {
  cursor:pointer
}

button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible {
  outline:3px solid #9bbd7c;
  outline-offset:3px
}

button:disabled {
  cursor:not-allowed;
  opacity:.5
}

a {
  color:var(--primary)
}

img {
  max-width:100%
}

::selection {
  background:#dbeabc;
  color:#163a2c
}


.loading-screen {
  min-height:90vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:12px;
  font-weight:700;
  color:var(--primary)
}

.loading-icon {
  font-size:54px;
  animation:spin 9s linear infinite
}

@keyframes spin {
  to {
    transform:rotate(360deg)
  }

  
}

.noscript {
  text-align:center;
  padding:24px
}


.app-shell {
  display:flex;
  min-height:100vh
}

.sidebar {
  position:fixed;
  inset:0 auto 0 0;
  width:252px;
  padding:34px 18px 26px 21px;
  background:#fffefa;
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  z-index:20
}

.brand {
  display:flex;
  align-items:center;
  gap:11px;
  text-decoration:none;
  color:var(--ink);
  padding:5px 11px 34px
}

.brand-icon {
  width:39px;
  height:39px;
  display:grid;
  place-items:center;
  background:var(--primary);
  color:#fbeaca;
  font-size:23px;
  border-radius:13px;
  transform:rotate(-7deg)
}

.brand-name {
  font-size:24px;
  letter-spacing:-1.2px;
  font-weight:820
}

.brand-dot {
  color:#cc9465
}

.brand-sub {
  font-size:10px;
  letter-spacing:1.65px;
  text-transform:uppercase;
  font-weight:760;
  color:var(--muted)
}

.side-label {
  font-size:10px;
  text-transform:uppercase;
  color:#9ea69e;
  letter-spacing:1.8px;
  font-weight:800;
  padding:0 13px 12px
}

.nav-list {
  display:flex;
  flex-direction:column;
  gap:5px
}

.nav-link {
  border:0;
  background:transparent;
  color:#66766c;
  text-align:left;
  display:flex;
  gap:12px;
  align-items:center;
  border-radius:13px;
  padding:12px 14px;
  font-size:13px;
  font-weight:710;
  transition:.2s
}

.nav-link svg {
  width:18px;
  height:18px;
  stroke-width:1.8
}

.nav-link:hover {
  background:#f3f7ef;
  color:var(--primary)
}

.nav-link.active {
  color:var(--primary);
  background:#e8f0e0
}

.nav-link.active svg {
  stroke-width:2.4
}

.side-spacer {
  flex:1
}

.side-tip {
  background:#edf2e8;
  border-radius:17px;
  padding:18px 17px 15px;
  margin-bottom:16px
}

.side-tip .tip-top {
  font-weight:800;
  font-size:13px
}

.side-tip p {
  font-size:12px;
  line-height:1.6;
  color:#6b776b;
  margin:6px 0 12px
}

.side-tip button {
  background:var(--primary);
  color:white;
  border:0;
  border-radius:10px;
  padding:9px 12px;
  font-size:11px;
  font-weight:800
}

.side-foot {
  font-size:11px;
  color:#a2aaa2;
  padding-left:12px
}

.main {
  margin-left:252px;
  width:calc(100% - 252px);
  min-height:100vh
}

.main-wrap {
  max-width:1340px;
  margin:0 auto;
  padding:0 46px 80px
}

.topbar {
  height:96px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px
}

.topbar-left {
  font-size:13px;
  font-weight:720;
  color:#66786c
}

.topbar-left strong {
  color:var(--primary)
}

.topbar-right {
  display:flex;
  align-items:center;
  gap:14px
}

.top-date {
  color:#869086;
  font-size:12px
}

.top-avatar {
  width:39px;
  height:39px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#e1e9d6;
  font-weight:900;
  color:var(--primary);
  font-size:19px
}

.top-score {
  background:#fffefa;
  display:flex;
  align-items:center;
  gap:6px;
  padding:9px 12px;
  border-radius:30px;
  border:1px solid var(--line);
  font-size:12px;
  font-weight:800
}

.top-score .spark {
  color:#bc9750
}


.page {
  animation:fadeIn .25s ease
}

@keyframes fadeIn {
  from {
    opacity:.7;
    transform:translateY(5px)
  }

  to {
    opacity:1;
    transform:translateY(0)
  }

  
}

.eyebrow {
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:2.1px;
  color:#7d9783;
  font-weight:850
}

.page-heading {
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:16px;
  margin:0 0 26px
}

.page-heading h1 {
  font:normal 46px/1.08 var(--serif);
  letter-spacing:-1.5px;
  margin:9px 0
}

.page-heading p {
  color:var(--muted);
  font-size:14px;
  max-width:570px;
  margin:7px 0 0
}

.section-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px
}

.section-title {
  font:normal 27px/1.18 var(--serif);
  letter-spacing:-.7px;
  margin:0
}

.section-sub {
  font-size:12px;
  color:var(--muted);
  margin:4px 0 0
}

.section-link {
  border:0;
  background:transparent;
  color:var(--primary);
  font-weight:810;
  font-size:12px;
  padding:8px 0
}

.section-link:hover {
  text-decoration:underline
}

.section {
  margin-top:35px
}

.pill {
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
  border-radius:20px;
  padding:6px 10px;
  display:inline-flex;
  gap:6px;
  align-items:center;
  font-weight:820
}

.pill.light {
  background:#edf2e7;
  color:#496452
}

.pill.dark {
  background:#315848;
  color:#d9e9c2
}

.pill.gold {
  background:#fff1d6;
  color:#7c6035
}


.btn {
  border:0;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  text-decoration:none;
  font-weight:790;
  font-size:13px;
  padding:13px 17px;
  border-radius:12px;
  transition:transform .15s,background .15s,box-shadow .15s;
  white-space:nowrap
}

.btn:hover:not(:disabled) {
  transform:translateY(-1px)
}

.btn svg {
  width:17px;
  height:17px
}

.btn-primary {
  background:var(--primary);
  color:white
}

.btn-primary:hover {
  background:#2b5b44
}

.btn-light {
  background:#f5f7ef;
  color:var(--primary);
  border:1px solid #e0e6d8
}

.btn-white {
  background:#fff;
  color:var(--primary)
}

.btn-outline {
  color:var(--primary);
  border:1px solid #d3ded1;
  background:transparent
}

.btn-wide {
  width:100%
}

.btn-small {
  padding:9px 13px;
  font-size:12px;
  border-radius:10px
}

.btn-quiet {
  background:transparent;
  border:0;
  color:var(--primary);
  padding:8px 4px
}

.icon-button {
  width:38px;
  height:38px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  display:grid;
  place-items:center;
  color:var(--primary)
}

.icon-button svg {
  width:18px;
  height:18px
}

.icon-button:hover {
  background:#edf2e8
}


.hero {
  background:var(--primary-deep);
  min-height:330px;
  border-radius:27px;
  position:relative;
  overflow:hidden;
  display:grid;
  grid-template-columns:minmax(0,1fr) 46%;
  box-shadow:var(--shadow)
}

.hero:before {
  content:'';
  position:absolute;
  width:380px;
  height:380px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:50%;
  right:35px;
  top:50%;
  transform:translateY(-50%)
}

.hero:after {
  content:'';
  position:absolute;
  width:540px;
  height:540px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:50%;
  right:-45px;
  top:50%;
  transform:translateY(-50%)
}

.hero-copy {
  padding:45px 0 42px 43px;
  position:relative;
  z-index:2
}

.hero .eyebrow {
  color:#cee5b9
}

.hero h1 {
  font:normal 53px/1.04 var(--serif);
  letter-spacing:-1.8px;
  color:#fffaf0;
  max-width:490px;
  margin:17px 0 15px
}

.hero h1 em {
  color:#e9be8e;
  font-style:italic
}

.hero p {
  color:#c3d3c5;
  font-size:14px;
  line-height:1.8;
  max-width:400px;
  margin:0 0 26px
}

.hero-actions {
  display:flex;
  gap:10px;
  flex-wrap:wrap
}

.hero .btn-primary {
  background:#e4b17f;
  color:#263e30
}

.hero .btn-primary:hover {
  background:#f0bd8b
}

.hero .btn-outline {
  border-color:#63816a;
  color:#f1f8ef
}

.hero-art {
  position:relative;
  min-height:300px;
  z-index:1
}

.orbit-disc {
  width:252px;
  height:252px;
  border-radius:50%;
  background:#ecdbc0;
  box-shadow:inset 0 -18px 55px #e0c69c,0 30px 45px rgba(0,0,0,.09);
  position:absolute;
  top:46px;
  right:18%;
  display:grid;
  place-items:center
}

.orbit-disc:before {
  content:'';
  position:absolute;
  width:182px;
  height:182px;
  border-radius:50%;
  border:1px dashed #bca782
}

.orbit-glyph {
  font-size:99px;
  filter:drop-shadow(0 9px 7px rgba(76,48,26,.15));
  transform:rotate(-10deg)
}

.bubble {
  position:absolute;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#fff5da;
  box-shadow:0 9px 24px rgba(0,0,0,.12);
  font-size:31px;
  z-index:3
}

.bubble-a {
  width:77px;
  height:77px;
  right:70%;
  top:36px;
  transform:rotate(-12deg)
}

.bubble-b {
  width:88px;
  height:88px;
  right:4%;
  top:34px;
  transform:rotate(15deg)
}

.bubble-c {
  width:73px;
  height:73px;
  right:4%;
  bottom:37px
}

.bubble-d {
  width:58px;
  height:58px;
  right:70%;
  bottom:23px;
  font-size:25px
}

.floating-label {
  position:absolute;
  background:#fffef7;
  padding:8px 13px;
  font-size:11px;
  font-weight:850;
  color:var(--primary);
  border-radius:40px;
  z-index:4;
  right:9%;
  top:53%;
  box-shadow:0 8px 24px rgba(0,0,0,.12);
  transform:rotate(-6deg)
}


.stats-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:17px;
  margin-top:22px
}

.stat-card {
  border:1px solid var(--line);
  background:var(--paper);
  padding:18px 21px;
  border-radius:19px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px
}

.stat-label {
  font-size:11px;
  font-weight:760;
  color:#899587
}

.stat-value {
  font-size:30px;
  font-weight:850;
  letter-spacing:-1px;
  line-height:1.1;
  margin:6px 0 0
}

.stat-hint {
  font-size:10px;
  color:#97a297;
  margin-top:4px
}

.stat-symbol {
  width:45px;
  height:45px;
  border-radius:15px;
  background:#edf1e9;
  display:grid;
  place-items:center;
  font-size:23px
}

.stat-symbol.gold {
  background:#fff0d9
}

.stat-symbol.pink {
  background:#f9eced
}


.two-col {
  display:grid;
  grid-template-columns:minmax(0,1.65fr) minmax(275px,.95fr);
  gap:22px;
  align-items:stretch
}

.surface {
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:var(--shadow)
}

.daily-card {
  padding:25px 27px;
  display:flex;
  flex-direction:column;
  gap:15px;
  min-height:226px
}

.daily-visual {
  display:grid;
  grid-template-columns:60px 1fr;
  gap:13px;
  align-items:center
}

.daily-emoji {
  height:60px;
  width:60px;
  border-radius:17px;
  background:#f5ead6;
  display:grid;
  place-items:center;
  font-size:32px
}

.daily-card h3,.feature-card h3 {
  font:normal 24px/1.25 var(--serif);
  margin:4px 0 4px
}

.daily-card p,.feature-card p {
  margin:0;
  color:#778377;
  font-size:12px;
  line-height:1.65
}

.daily-bottom {
  margin-top:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px
}

.small-label {
  font-size:11px;
  font-weight:850;
  color:#79917d;
  text-transform:uppercase;
  letter-spacing:1px
}

.feature-card {
  background:#f0efe2;
  border:1px solid #eae7d8;
  min-height:220px;
  border-radius:22px;
  padding:27px;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden
}

.feature-card:after {
  content:'✳';
  color:#d6ddc3;
  position:absolute;
  font-size:180px;
  right:-15px;
  bottom:-85px;
  line-height:1;
  pointer-events:none
}

.feature-card>* {
  position:relative;
  z-index:1
}

.feature-card h3 {
  max-width:210px
}

.feature-card p {
  max-width:230px;
  margin:8px 0 16px
}

.feature-card .btn {
  margin-top:auto;
  align-self:flex-start
}


.aroma-grid {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:16px
}

.aroma-card {
  background:#fffefa;
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  position:relative;
  transition:box-shadow .2s,transform .2s,border-color .2s;
  cursor:pointer;
  text-align:left;
  display:flex;
  flex-direction:column;
  min-height:230px
}

.aroma-card:hover {
  transform:translateY(-3px);
  box-shadow:0 14px 28px rgba(31,65,46,.09);
  border-color:#d7dfce
}

.aroma-art {
  height:132px;
  display:grid;
  place-items:center;
  position:relative;
  overflow:hidden;
  background:var(--tile)
}

.aroma-art:before {
  content:'';
  position:absolute;
  left:50%;
  top:50%;
  width:155px;
  height:155px;
  border:1px solid rgba(255,255,255,.8);
  border-radius:50%;
  transform:translate(-50%,-50%)
}

.aroma-art:after {
  content:'';
  position:absolute;
  left:50%;
  top:50%;
  width:105px;
  height:105px;
  border:1px solid rgba(255,255,255,.8);
  border-radius:50%;
  transform:translate(-50%,-50%)
}

.aroma-emoji {
  font-size:62px;
  position:relative;
  z-index:1;
  filter:drop-shadow(0 7px 5px rgba(0,0,0,.06))
}

.card-bookmark {
  position:absolute;
  top:10px;
  right:10px;
  width:28px;
  height:28px;
  border:0;
  background:rgba(255,255,255,.86);
  border-radius:9px;
  display:grid;
  place-items:center;
  z-index:2;
  color:#829084
}

.card-bookmark.saved {
  color:#ca8154
}

.card-bookmark svg {
  width:16px;
  height:16px
}

.aroma-card-body {
  padding:15px 16px 17px
}

.aroma-card-kicker {
  color:#96a095;
  text-transform:uppercase;
  font-size:9px;
  letter-spacing:1.4px;
  font-weight:850
}

.aroma-card h3 {
  font-size:17px;
  letter-spacing:-.4px;
  margin:4px 0 5px
}

.aroma-card p {
  font-size:11px;
  color:#869188;
  line-height:1.5;
  margin:0
}

.aroma-card-bottom {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:11px;
  gap:6px
}

.molecule-chip {
  background:#f4f6ef;
  color:#738672;
  padding:5px 7px;
  border-radius:6px;
  font-size:9px;
  font-weight:740;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.discovered-check {
  color:#548864;
  font-size:11px;
  display:inline-flex;
  align-items:center;
  gap:3px
}

.discovered-check svg {
  width:14px;
  height:14px
}


.tools-bar {
  display:flex;
  flex-direction:column;
  gap:16px;
  margin-bottom:22px
}

.search-row {
  display:flex;
  align-items:center;
  gap:12px
}

.search-box {
  position:relative;
  flex:1
}

.search-box svg {
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  width:18px;
  height:18px;
  color:#8f9b91
}

.search-input {
  display:block;
  width:100%;
  height:48px;
  border:1px solid var(--line);
  background:#fffefa;
  border-radius:13px;
  padding:0 14px 0 45px;
  color:var(--ink);
  outline:none
}

.search-input:focus {
  border-color:#6f927d
}

.search-input::placeholder {
  color:#9fa9a0
}

.filter-row {
  display:flex;
  gap:8px;
  overflow:auto;
  padding-bottom:4px;
  scrollbar-width:thin
}

.filter-pill {
  border:1px solid #e1e8dd;
  background:#fffefa;
  padding:9px 13px;
  white-space:nowrap;
  border-radius:20px;
  color:#708175;
  font-size:12px;
  font-weight:720
}

.filter-pill:hover {
  border-color:#bfd2bd
}

.filter-pill.selected {
  background:var(--primary);
  color:white;
  border-color:var(--primary)
}

.filter-pill span {
  margin-right:5px
}

.result-info {
  font-size:12px;
  color:#7b887c;
  padding:0 1px 3px
}

.empty-state {
  background:#fffefa;
  border:1px dashed #d3ddcf;
  border-radius:22px;
  padding:44px 25px;
  text-align:center;
  grid-column:1/-1
}

.empty-state .big {
  font-size:49px
}

.empty-state h3 {
  font:normal 26px var(--serif);
  margin:10px 0
}

.empty-state p {
  color:var(--muted);
  max-width:440px;
  margin:0 auto 20px;
  font-size:13px
}


.category-grid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:13px
}

.category-tile {
  min-height:120px;
  position:relative;
  padding:18px;
  border:1px solid var(--line);
  border-radius:17px;
  text-align:left;
  color:var(--ink);
  overflow:hidden
}

.category-tile:hover {
  transform:translateY(-2px)
}

.category-tile .cat-emoji {
  font-size:30px;

.category-tile strong {

.category-tile small {

.quiz-modes {

.mode-card {

  align-items:flex-start;

  border-radius:15px;
  height:58px;
  width:58px;
  display:grid;
  place-items:center;
  font-size:27px
}

.mode-card h3 {
  font:normal 24px var(--serif);
  margin:4px 0 -7px
}

.mode-card p {
  color:var(--muted);

.mode-meta {

  font-weight:750
}

.mode-cta {

}

.quiz-panel {
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:25px;
  padding:34px;
  max-width:800px;
  margin:auto
}

.quiz-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:17px
}

.quiz-count {

  font-weight:780
}

.progress-track {
  height:8px;
  background:#e8eee4;
  border-radius:20px;
  overflow:hidden
}

.progress-fill {
  height:100%;
  background:#7da77a;
  border-radius:20px;
  transition:width .25s
}

.question-kicker {
  font-size:11px;
  color:#86a082;
  text-transform:uppercase;
  letter-spacing:1.35px;
  font-weight:850;
  margin-top:30px
}

.quiz-question {
  font:normal 32px/1.22 var(--serif);
  max-width:650px;
  margin:11px 0 25px
}

.quiz-choices {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px
}

.choice {
  background:#f7f8f3;
  border:1px solid #e3e9e0;
  border-radius:14px;
  padding:16px;
  text-align:left;
  display:flex;
  align-items:center;
  gap:11px;
  min-height:65px;
  color:#34483a;
  font-weight:750
}

.choice:hover:not(:disabled) {
  border-color:#b7cdb6;
  background:#f1f5ed
}

.choice-letter {
  height:31px;
  width:31px;
  flex:none;
  border-radius:10px;
  background:#e5ede0;
  display:grid;
  place-items:center;
  font-size:12px
}

.choice.correct {
  background:#edf5e8;
  border-color:#7eb08b
}

.choice.wrong {
  background:#fff0e9;
  border-color:#dca486
}

.choice:disabled {
  opacity:1
}

.choice.correct .choice-letter {
  background:#d1e5cd
}

.choice.wrong .choice-letter {
  background:#f8d6c8
}

.answer-panel {
  margin-top:22px;
  border-radius:15px;
  padding:18px;
  background:#f1f6eb;
  border:1px solid #dce8d3
}

.answer-panel.wrong {
  background:#fff4ee;
  border-color:#f0ded3
}

.answer-panel strong {
  display:block;
  margin-bottom:6px
}

.answer-panel p {
  font-size:13px;
  color:#6c796e;
  margin:0;
  line-height:1.7
}

.answer-actions {
  display:flex;
  justify-content:flex-end;
  margin-top:17px
}

.quiz-result {
  text-align:center;
  padding:40px 15px
}

.quiz-result .trophy {

}

.quiz-result h2 {
  font:normal 43px var(--serif);
  margin:14px 0
}

.quiz-result p {
  color:var(--muted);
  max-width:450px;
  margin:10px auto 24px
}

.result-number {
  font-size:61px;
  font-weight:850;
  color:var(--primary);
  line-height:1
}

.result-number span {
  font-size:23px;
  color:#9aa99c
}

.result-buttons {
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap
}


.collection-top {
  background:#e8efe3;
  border:1px solid #e0eadd;

}

}

.collection-top p {

  color:#607362;

  margin:0
}

.round-meter {
  flex:none;

  height:124px;
  border-radius:50%;

  display:grid;
  place-items:center
}

.meter-inner {
  border-radius:50%;
  background:#e8efe3;
  width:104px;
  height:104px;
  display:grid;
  place-items:center;
  align-content:center
}

.meter-inner strong {
  font-size:27px
}

.meter-inner span {
  font-size:10px;
  color:#7c917e
}

.achievement-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px
}

.achievement {
  background:#fffefa;
  border:1px solid var(--line);
  border-radius:16px;
  padding:17px;

  gap:11px;
  align-items:center;
  opacity:.55
}

.achievement.earned {

  background:#fffefa
}

.achievement-icon {

  height:46px;

  border-radius:15px;
  background:#f3efdd;

  place-items:center;

}

.achievement strong {
  font-size:12px;

}

.achievement span {
  font-size:10px;
  color:var(--muted)
}

.section-note {

  color:#637563;

}


.about-layout {

  gap:20px
}

.about-card {

}

.about-card p,.about-card li {

}

.about-card ul {
  padding-left:18px
}

.source-item {

}

.source-item:last-child {

}

.source-item a {

  font-weight:790;
  text-decoration:none
}

.source-item p {
  font-size:11px;
  margin:3px 0
}

.about-info {
  background:#eaf0e4;
  border-radius:16px;
  padding:19px;
  margin-top:20px
}

.about-info strong {
  font-size:13px
}

.about-info p {
  font-size:12px;

}


.modal-backdrop {

  inset:0;
  background:rgba(15,38,26,.58);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;

.modal {

  top:-85px;

}

.modal-feature small {

.detail-columns {

  height:16px

.detail-block p {

  color:#748274;

  margin:0
}

  border:1px solid #f3e7ce

  font-size:12px;

}

.insight p {

  margin:0
}

  font-size:13px;

  margin:0
}

.note-area {

.modal-actions {

.modal-sources {

  color:#87948a

.modal-sources a {
  margin:5px 8px 5px 0;

  text-decoration:underline
}

.toast {
  position:fixed;
  z-index:150;
  bottom:28px;
  left:50%;

  background:#1f4735;
  color:#fff;
  padding:13px 20px;
  border-radius:13px;
  font-size:12px;
  font-weight:700;
  box-shadow:0 10px 30px #0003;
  pointer-events:none

.bottom-nav {

.mobile-logo {

.footer-note {

  border:0;
  background:none;
  color:#66836e;
  font-size:inherit;
  text-decoration:underline

  function quizModes(){const modes=[{mode:'aroma',emoji:'👃',title:'Devine l’arôme',desc:'Reconnais une note à partir de la molécule et de quelques indices sensoriels.',meta:'8 questions · Découverte'},{mode:'molecule',emoji:'🧬',title:'Molécule mystère',desc:'Associe les arômes à leurs principaux composés odorants.',meta:'8 questions · Chimie'},{mode:'truefalse',emoji:'⚖️',title:'Mythe ou science ?',desc:'Démêle les idées reçues et les faits scientifiques en quelques clics.',meta:'8 questions · Culture'}];return `<div class="quiz-modes">${modes.map((m,i)=>`<button class="mode-card" data-start-quiz="${m.mode}"><span class="mode-icon" style="background:${['#eef2e2','#f7ece5','#eee9f5'][i]}">${m.emoji}</span><h3>${m.title}</h3><p>${m.desc}</p><span class="mode-meta">${m.meta}</span><span class="mode-cta">Commencer ${svg('right')}</span></button>`).join('')}</div>`;}

    {emoji:'🌞',name:'À demain !',desc:'3 défis du jour réalisés',ok:d>=3}
  ];}
  function collection(){const done=aromes.filter(a=>saved.discovered.includes(a.id));const fav=aromes.filter(a=>saved.favorites.includes(a.id));const pct=100*done.length/aromes.length;return `<div class="page">${title('Ton carnet personnel','Ma collection.','Garde la trace des arômes que tu as identifiés dans la vie quotidienne et retrouve tes favoris.')}<div class="collection-top"><div><span class="eyebrow">✦ Mon parcours</span><h2>${done.length===aromes.length?'Collection complète !':'Chaque découverte compte.'}</h2><p>${done.length} arôme${done.length>1?'s':''} repéré${done.length>1?'s':''} sur ${aromes.length}. Ouvre une fiche et coche « Je l’ai senti » pour l’ajouter ici.</p></div><div class="round-meter" style="--pct:${pct}%"><div class="meter-inner"><strong>${Math.round(pct)} %</strong><span>complété</span></div></div></div>
    <section class="section"><div class="section-head"><div><h2 class="section-title">Mes badges</h2><p class="section-sub">Ils se débloquent en explorant et en jouant.</p></div></div><div class="achievement-grid">${achievements().map(a=>`<div class="achievement ${a.ok?'earned':''}"><div class="achievement-icon">${a.ok?a.emoji:'🔒'}</div><div><strong>${a.name}</strong><span>${a.desc}</span></div></div>`).join('')}</div></section>
    <section class="section"><div class="section-head"><div><h2 class="section-title">Arômes déjà découverts</h2><p class="section-sub">${done.length} / ${aromes.length} trouvés.</p></div><button class="section-link" data-nav="explore">Tout explorer →</button></div><div class="aroma-grid">${done.length?done.map(aromaCard).join(''):`<div class="empty-state"><div class="big">🌱</div><h3>Ton aventure commence ici</h3><p>Commence par une odeur simple : le citron, le café ou une banane mûre. Ouvre ensuite sa fiche et marque-la comme découverte.</p><button class="btn btn-primary" data-nav="explore">Découvrir les arômes ${svg('right')}</button></div>`}</div></section>
    <section class="section"><div class="section-head"><div><h2 class="section-title">Mes favoris</h2><p class="section-sub">Tes références à retrouver en un clin d’œil.</p></div></div><div class="aroma-grid">${fav.length?fav.map(aromaCard).join(''):`<div class="empty-state"><div class="big">♡</div><h3>Pas encore de favoris</h3><p>Touche le cœur d’une fiche pour enregistrer tes arômes préférés.</p><button class="btn btn-outline" data-nav="explore">Explorer la bibliothèque</button></div>`}</div></section>
    <section class="section"><div class="section-note">🔒 Tes découvertes, quiz et notes restent <strong>sur cet appareil, dans ce navigateur</strong>. Elles ne sont pas synchronisées avec un compte. Effacer les données du navigateur peut les supprimer.</div></section></div>`;}
  function about(){return `<div class="page">${title('À propos du projet','Un labo dans ta poche.','Une porte d’entrée ludique vers les odeurs, la chimie des arômes et la dégustation sensorielle.')}<div class="about-layout"><section class="surface about-card"><h2>La science derrière AromaLab</h2><p>Chaque fiche fait le lien entre une <strong>odeur reconnaissable</strong>, un <strong>composé parfois associé</strong> et des exemples d’expression dans le vin ou la bière.</p><p>La réalité est plus nuancée : un même descripteur peut résulter d’un mélange de molécules, et l’effet sensoriel dépend de leur concentration, du produit et de la sensibilité individuelle. Les exemples sont indicatifs et ne constituent pas des règles absolues.</p><div class="about-info"><strong>🌿 Apprendre sans consommer</strong><p>Les défis olfactifs utilisent des produits alimentaires ou végétaux du quotidien. Tu n’as pas besoin de boire d’alcool. Ne sens jamais de produits chimiques, de solvants ou de fumées volontairement pour réaliser un exercice.</p></div><div class="about-info"><strong>🔒 Respect de tes données</strong><p>Pas de compte, pas de publicité, pas de serveur de suivi : les favoris, notes et scores sont enregistrés localement dans ce navigateur. Tu peux supprimer ces données à tout moment.</p><button class="btn btn-outline btn-small" style="margin-top:12px" data-clear-data>${svg('trash')} Effacer mes données</button></div><div class="about-info"><strong>📱 Installer AromaLab</strong><p>Une fois le site publié en HTTPS, ouvre-le dans ton navigateur et choisis « Ajouter à l’écran d’accueil » ou « Installer l’application ». L’installation varie selon l’appareil.</p><button class="btn btn-primary btn-small" style="margin-top:12px" data-install>Installer si disponible ${svg('right')}</button></div></section>
    <section class="surface about-card"><h2>Sources scientifiques</h2><p>Sélection de références ayant servi à rédiger les fiches. Les liens nécessitent une connexion à Internet.</p>${DB.sources.map(s=>`<div class="source-item"><a href="${safeString(s.url)}" target="_blank" rel="noopener noreferrer">${safeString(s.title)} ↗</a><p>${safeString(s.info)}</p></div>`).join('')}</section></div></div>`;}
  function detailModal(a){if(!a)return '';const cat=findCat(a.category),done=saved.discovered.includes(a.id),fav=saved.favorites.includes(a.id),note=typeof saved.notes[a.id]==='string'?saved.notes[a.id]:'';return `<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="icon-button modal-close" data-close-modal aria-label="Fermer la fiche">${svg('x')}</button><div class="modal-hero" style="--tile:${cat.pale}"><div class="modal-emoji" aria-hidden="true">${a.emoji}</div><div class="modal-hero-text"><span class="eyebrow">${cat.icon} ${cat.name}</span><h2 id="modal-title">${safeString(a.name)}</h2><p>${safeString(a.subtitle)}</p></div></div><div class="modal-content"><p class="modal-intro">Découvre cette note, son origine possible et les contextes où elle peut se manifester.</p><div class="modal-feature"><div class="tiny">🧬 Molécule associée</div><strong>${safeString(a.molecule)}</strong><small>${safeString(a.family)} · Exemple de composé, pas une origine exclusive</small></div>
    <div class="detail-columns"><div class="detail-block"><div class="detail-label">${svg('flask')} D’où vient-elle ?</div><p>${safeString(a.origin)}</p></div><div class="detail-block"><div class="detail-label">${svg('explore')} Au quotidien</div><p>${safeString(a.everyday)}</p></div><div class="detail-block"><div class="detail-label">${svg('wine')} Dans le vin</div><p>${safeString(a.wine)}</p></div><div class="detail-block"><div class="detail-label">${svg('beer')} Dans la bière</div><p>${safeString(a.beer)}</p></div></div>
    <div class="insight"><h4>✦ La minute science</h4><p>${safeString(a.insight)}</p></div><div class="sniff-box"><h4>👃 Le défi olfactif</h4><p>${safeString(a.sniff)}</p></div>
    <div style="margin-top:22px"><label class="small-label" for="aroma-note">✎ Mes impressions personnelles</label><textarea id="aroma-note" class="note-area" maxlength="1000" placeholder="Ex. : senti dans un zeste frais, très intense…">${safeString(note)}</textarea></div>
    <div class="modal-actions"><button class="btn ${done?'btn-light':'btn-primary'}" data-discover="${a.id}">${svg('check')} ${done?'Déjà senti ✓':'Je l’ai senti !'}</button><button class="btn ${fav?'btn-light':'btn-outline'}" data-detail-fav="${a.id}">${svg('heart')} ${fav?'En favori ♥':'Ajouter aux favoris'}</button><button class="btn btn-light" data-save-note="${a.id}">Enregistrer ma note</button></div>
    <div class="modal-sources">Sources associées : ${a.sources.map(id=>{const s=DB.sources.find(x=>x.id===id);return s?`<a href="${safeString(s.url)}" target="_blank" rel="noopener noreferrer">${safeString(s.title)} ↗</a>`:'';}).join('')}</div>
  </div></section></div>`;}
  function render(){let body;switch(state.page){case 'explore':body=explore();break;case 'game':body=game();break;case 'collection':body=collection();break;case 'about':body=about();break;case 'daily':body=daily();break;default:body=home();}app.innerHTML=shell(body)+(state.modal?detailModal(findAroma(state.modal)):'');document.body.style.overflow=state.modal?'hidden':'';if(state.modal)app.querySelector('.modal-close')?.focus();}
  let toastTimer;
  function notify(message){document.querySelector('.toast')?.remove();const div=document.createElement('div');div.className='toast';div.setAttribute('role','status');div.textContent=message;document.body.append(div);clearTimeout(toastTimer);toastTimer=setTimeout(()=>div.remove(),2700);}
  function toggleFavorite(id){saved.favorites=saved.favorites.includes(id)?saved.favorites.filter(x=>x!==id):[...saved.favorites,id];persist();render();notify(saved.favorites.includes(id)?'Ajouté aux favoris ♡':'Retiré des favoris');}
  function toggleDiscovered(id){saved.discovered=saved.discovered.includes(id)?saved.discovered.filter(x=>x!==id):[...saved.discovered,id];persist();render();notify(saved.discovered.includes(id)?'Une nouvelle découverte dans ta collection !':'Arôme retiré de la collection');}
  function nextQuestion(){const q=state.quiz;if(!q || q.selected===null)return;if(q.idx===q.items.length-1){q.done=true;if(!q.recorded){saved.results.push({mode:q.mode,score:q.score,total:q.items.length,date:Date.now()});saved.results=saved.results.slice(-80);q.recorded=true;persist();}}else{q.idx++;q.selected=null;}render();}
  const shareScore = async () => {if(!state.quiz)return;const text=`J'ai obtenu ${state.quiz.score}/${state.quiz.items.length} au quiz AromaLab 🌿🧪. À toi de jouer !`;try {if(navigator.share){await navigator.share({title:'AromaLab',text});notify('Partage prêt !');return;}if(navigator.clipboard && window.isSecureContext){await navigator.clipboard.writeText(text);notify('Score copié !');return;}const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();notify(ok?'Score copié !':'Copie non disponible.');}catch(e){if(e.name!=='AbortError')notify('Partage indisponible sur cet appareil.');}};
  document.addEventListener('click',async event=>{
    const el=event.target.closest('[data-nav],[data-go-category],[data-filter],[data-open],[data-favorite],[data-detail-fav],[data-close-modal],[data-discover],[data-save-note],[data-reset-filters],[data-start-quiz],[data-exit-quiz],[data-quiz-option],[data-next-question],[data-daily-answer],[data-share-score],[data-install],[data-clear-data]');
    if(!el)return;
    if(el.matches('[data-favorite]')){event.stopPropagation();toggleFavorite(el.dataset.favorite);return;}
    if(el.matches('[data-detail-fav]')){toggleFavorite(el.dataset.detailFav);return;}
    if(el.matches('[data-close-modal]')){if(el.classList.contains('modal-backdrop')&&event.target!==el)return;state.modal=null;render();return;}
    if(el.matches('[data-discover]')){toggleDiscovered(el.dataset.discover);return;}
    if(el.matches('[data-save-note]')){const t=document.getElementById('aroma-note');saved.notes[el.dataset.saveNote]=t?t.value.trim():'';persist();notify('Ta note est enregistrée sur cet appareil.');return;}
    if(el.matches('[data-open]')){state.modal=el.dataset.open;render();return;}
    if(el.matches('[data-go-category]')){state.search='';navigate('explore',{filter:el.dataset.goCategory});return;}
    if(el.matches('[data-filter]')){state.filter=el.dataset.filter;render();return;}
    if(el.matches('[data-reset-filters]')){state.filter='all';state.search='';render();return;}
    if(el.matches('[data-start-quiz]')){state.quiz=buildQuiz(el.dataset.startQuiz);state.page='game';render();window.scrollTo({top:0,behavior:'instant'});return;}
    if(el.matches('[data-exit-quiz]')){state.quiz=null;render();return;}
    if(el.matches('[data-quiz-option]')){const q=state.quiz;if(!q||q.selected!==null)return;q.selected=el.dataset.quizOption;if(q.selected===q.items[q.idx].answer)q.score++;render();return;}
    if(el.matches('[data-next-question]')){nextQuestion();return;}
    if(el.matches('[data-daily-answer]')){if(dailyPlayed())return;const answer=el.dataset.dailyAnswer==='Vrai';saved.daily[todayKey()]={answer:el.dataset.dailyAnswer,correct:answer===dailyQuestion().answer};persist();render();return;}
    if(el.matches('[data-share-score]')){await shareScore();return;}
    if(el.matches('[data-install]')){if(deferredInstall){await deferredInstall.prompt();deferredInstall=null;}else notify('Utilise le menu de ton navigateur : « Ajouter à l’écran d’accueil ».');return;}
    if(el.matches('[data-clear-data]')){if(confirm('Effacer définitivement tes notes, favoris, découvertes et scores sur cet appareil ?')){saved=emptyStore();persist();state.quiz=null;render();notify('Données locales effacées.');}return;}
    if(el.matches('[data-nav]')){event.preventDefault();navigate(el.dataset.nav);return;}
  });
  document.addEventListener('input',event=>{
    if(event.target.id==='aroma-note' && state.modal){saved.notes[state.modal]=event.target.value;persist();return;}
    if(event.target.id!=='aroma-search')return;
    state.search=event.target.value;
    const container=document.getElementById('library-results');if(container)container.innerHTML=libraryGrid();
  });
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&state.modal){state.modal=null;render();return;}
    if(event.key==='Tab'&&state.modal){
      const modal=document.querySelector('.modal');
      if(modal){const focusables=[...modal.querySelectorAll('button:not(:disabled),a[href],textarea,input')];if(focusables.length){const first=focusables[0],last=focusables[focusables.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}}
    }
    if((event.key==='Enter'||event.key===' ')&&event.target.matches('.aroma-card')){event.preventDefault();state.modal=event.target.dataset.open;render();}
  });
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;});
  // Application autonome : le contenu et les quiz restent intégrés à ce HTML.
  render();
})();

</script>
<script>
// Enregistrement non bloquant : si le service worker échoue, AromaLab fonctionne quand même.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .catch(error => console.warn('Mode hors ligne indisponible :', error));
  });
}
</script>
</body></html>
