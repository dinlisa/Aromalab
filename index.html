<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="theme-color" content="#193f32"><meta name="description" content="AromaLab : 60 fiches aromatiques, plus de 150 questions sourcées, quiz, progression et défis quotidiens autour du vin et de la bière."><link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="AromaLab">
<title>AromaLab — Le goût de la découverte</title><style>
:root {
  --bg:#f7f7f2;
  --paper:#fffefa;
  --ink:#203329;
  --muted:#748075;
  --primary:#214b3a;
  --primary-deep:#153b2d;
  --lime:#d6e5b3;
  --accent:#e6b381;
  --line:#e7eae1;
  --shadow:0 12px 40px rgba(34,60,46,.045);
  --radius:22px;
  --font:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --serif:Georgia,'Times New Roman',serif
}


* {
  box-sizing:border-box
}

html {
  scroll-behavior:smooth
}

body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased
}

button,input,textarea {
  font:inherit
}

button {
  cursor:pointer
}

button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible {
  outline:3px solid #9bbd7c;
  outline-offset:3px
}

button:disabled {
  cursor:not-allowed;
  opacity:.5
}

a {
  color:var(--primary)
}

img {
  max-width:100%
}

::selection {
  background:#dbeabc;
  color:#163a2c
}


.loading-screen {
  min-height:90vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:12px;
  font-weight:700;
  color:var(--primary)
}

.loading-icon {
  font-size:54px;
  animation:spin 9s linear infinite
}

@keyframes spin {
  to {
    transform:rotate(360deg)
  }

  
}

.noscript {
  text-align:center;
  padding:24px
}


.app-shell {
  display:flex;
  min-height:100vh
}

.sidebar {
  position:fixed;
  inset:0 auto 0 0;
  width:252px;
  padding:34px 18px 26px 21px;
  background:#fffefa;
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  z-index:20
}

.brand {
  display:flex;
  align-items:center;
  gap:11px;
  text-decoration:none;
  color:var(--ink);
  padding:5px 11px 34px
}

.brand-icon {
  width:39px;
  height:39px;
  display:grid;
  place-items:center;
  background:var(--primary);
  color:#fbeaca;
  font-size:23px;
  border-radius:13px;
  transform:rotate(-7deg)
}

.brand-name {
  font-size:24px;
  letter-spacing:-1.2px;
  font-weight:820
}

.brand-dot {
  color:#cc9465
}

.brand-sub {
  font-size:10px;
  letter-spacing:1.65px;
  text-transform:uppercase;
  font-weight:760;
  color:var(--muted)
}

.side-label {
  font-size:10px;
  text-transform:uppercase;
  color:#9ea69e;
  letter-spacing:1.8px;
  font-weight:800;
  padding:0 13px 12px
}

.nav-list {
  display:flex;
  flex-direction:column;
  gap:5px
}

.nav-link {
  border:0;
  background:transparent;
  color:#66766c;
  text-align:left;
  display:flex;
  gap:12px;
  align-items:center;
  border-radius:13px;
  padding:12px 14px;
  font-size:13px;
  font-weight:710;
  transition:.2s
}

.nav-link svg {
  width:18px;
  height:18px;
  stroke-width:1.8
}

.nav-link:hover {
  background:#f3f7ef;
  color:var(--primary)
}

.nav-link.active {
  color:var(--primary);
  background:#e8f0e0
}

.nav-link.active svg {
  stroke-width:2.4
}

.side-spacer {
  flex:1
}

.side-tip {
  background:#edf2e8;
  border-radius:17px;
  padding:18px 17px 15px;
  margin-bottom:16px
}

.side-tip .tip-top {
  font-weight:800;
  font-size:13px
}

.side-tip p {
  font-size:12px;
  line-height:1.6;
  color:#6b776b;
  margin:6px 0 12px
}

.side-tip button {
  background:var(--primary);
  color:white;
  border:0;
  border-radius:10px;
  padding:9px 12px;
  font-size:11px;
  font-weight:800
}

.side-foot {
  font-size:11px;
  color:#a2aaa2;
  padding-left:12px
}

.main {
  margin-left:252px;
  width:calc(100% - 252px);
  min-height:100vh
}

.main-wrap {
  max-width:1340px;
  margin:0 auto;
  padding:0 46px 80px
}

.topbar {
  height:96px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px
}

.topbar-left {
  font-size:13px;
  font-weight:720;
  color:#66786c
}

.topbar-left strong {
  color:var(--primary)
}

.topbar-right {
  display:flex;
  align-items:center;
  gap:14px
}

.top-date {
  color:#869086;
  font-size:12px
}

.top-avatar {
  width:39px;
  height:39px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#e1e9d6;
  font-weight:900;
  color:var(--primary);
  font-size:19px
}

.top-score {
  background:#fffefa;
  display:flex;
  align-items:center;
  gap:6px;
  padding:9px 12px;
  border-radius:30px;
  border:1px solid var(--line);
  font-size:12px;
  font-weight:800
}

.top-score .spark {
  color:#bc9750
}


.page {
  animation:fadeIn .25s ease
}

@keyframes fadeIn {
  from {
    opacity:.7;
    transform:translateY(5px)
  }

  to {
    opacity:1;
    transform:translateY(0)
  }

  
}

.eyebrow {
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:2.1px;
  color:#7d9783;
  font-weight:850
}

.page-heading {
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:16px;
  margin:0 0 26px
}

.page-heading h1 {
  font:normal 46px/1.08 var(--serif);
  letter-spacing:-1.5px;
  margin:9px 0
}

.page-heading p {
  color:var(--muted);
  font-size:14px;
  max-width:570px;
  margin:7px 0 0
}

.section-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px
}

.section-title {
  font:normal 27px/1.18 var(--serif);
  letter-spacing:-.7px;
  margin:0
}

.section-sub {
  font-size:12px;
  color:var(--muted);
  margin:4px 0 0
}

.section-link {
  border:0;
  background:transparent;
  color:var(--primary);
  font-weight:810;
  font-size:12px;
  padding:8px 0
}

.section-link:hover {
  text-decoration:underline
}

.section {
  margin-top:35px
}

.pill {
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
  border-radius:20px;
  padding:6px 10px;
  display:inline-flex;
  gap:6px;
  align-items:center;
  font-weight:820
}

.pill.light {
  background:#edf2e7;
  color:#496452
}

.pill.dark {
  background:#315848;
  color:#d9e9c2
}

.pill.gold {
  background:#fff1d6;
  color:#7c6035
}


.btn {
  border:0;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  text-decoration:none;
  font-weight:790;
  font-size:13px;
  padding:13px 17px;
  border-radius:12px;
  transition:transform .15s,background .15s,box-shadow .15s;
  white-space:nowrap
}

.btn:hover:not(:disabled) {
  transform:translateY(-1px)
}

.btn svg {
  width:17px;
  height:17px
}

.btn-primary {
  background:var(--primary);
  color:white
}

.btn-primary:hover {
  background:#2b5b44
}

.btn-light {
  background:#f5f7ef;
  color:var(--primary);
  border:1px solid #e0e6d8
}

.btn-white {
  background:#fff;
  color:var(--primary)
}

.btn-outline {
  color:var(--primary);
  border:1px solid #d3ded1;
  background:transparent
}

.btn-wide {
  width:100%
}

.btn-small {
  padding:9px 13px;
  font-size:12px;
  border-radius:10px
}

.btn-quiet {
  background:transparent;
  border:0;
  color:var(--primary);
  padding:8px 4px
}

.icon-button {
  width:38px;
  height:38px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  display:grid;
  place-items:center;
  color:var(--primary)
}

.icon-button svg {
  width:18px;
  height:18px
}

.icon-button:hover {
  background:#edf2e8
}


.hero {
  background:var(--primary-deep);
  min-height:330px;
  border-radius:27px;
  position:relative;
  overflow:hidden;
  display:grid;
  grid-template-columns:minmax(0,1fr) 46%;
  box-shadow:var(--shadow)
}

.hero:before {
  content:'';
  position:absolute;
  width:380px;
  height:380px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:50%;
  right:35px;
  top:50%;
  transform:translateY(-50%)
}

.hero:after {
  content:'';
  position:absolute;
  width:540px;
  height:540px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:50%;
  right:-45px;
  top:50%;
  transform:translateY(-50%)
}

.hero-copy {
  padding:45px 0 42px 43px;
  position:relative;
  z-index:2
}

.hero .eyebrow {
  color:#cee5b9
}

.hero h1 {
  font:normal 53px/1.04 var(--serif);
  letter-spacing:-1.8px;
  color:#fffaf0;
  max-width:490px;
  margin:17px 0 15px
}

.hero h1 em {
  color:#e9be8e;
  font-style:italic
}

.hero p {
  color:#c3d3c5;
  font-size:14px;
  line-height:1.8;
  max-width:400px;
  margin:0 0 26px
}

.hero-actions {
  display:flex;
  gap:10px;
  flex-wrap:wrap
}

.hero .btn-primary {
  background:#e4b17f;
  color:#263e30
}

.hero .btn-primary:hover {
  background:#f0bd8b
}

.hero .btn-outline {
  border-color:#63816a;
  color:#f1f8ef
}

.hero-art {
  position:relative;
  min-height:300px;
  z-index:1
}

.orbit-disc {
  width:252px;
  height:252px;
  border-radius:50%;
  background:#ecdbc0;
  box-shadow:inset 0 -18px 55px #e0c69c,0 30px 45px rgba(0,0,0,.09);
  position:absolute;
  top:46px;
  right:18%;
  display:grid;
  place-items:center
}

.orbit-disc:before {
  content:'';
  position:absolute;
  width:182px;
  height:182px;
  border-radius:50%;
  border:1px dashed #bca782
}

.orbit-glyph {
  font-size:99px;
  filter:drop-shadow(0 9px 7px rgba(76,48,26,.15));
  transform:rotate(-10deg)
}

.bubble {
  position:absolute;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#fff5da;
  box-shadow:0 9px 24px rgba(0,0,0,.12);
  font-size:31px;
  z-index:3
}

.bubble-a {
  width:77px;
  height:77px;
  right:70%;
  top:36px;
  transform:rotate(-12deg)
}

.bubble-b {
  width:88px;
  height:88px;
  right:4%;
  top:34px;
  transform:rotate(15deg)
}

.bubble-c {
  width:73px;
  height:73px;
  right:4%;
  bottom:37px
}

.bubble-d {
  width:58px;
  height:58px;
  right:70%;
  bottom:23px;
  font-size:25px
}

.floating-label {
  position:absolute;
  background:#fffef7;
  padding:8px 13px;
  font-size:11px;
  font-weight:850;
  color:var(--primary);
  border-radius:40px;
  z-index:4;
  right:9%;
  top:53%;
  box-shadow:0 8px 24px rgba(0,0,0,.12);
  transform:rotate(-6deg)
}


.stats-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:17px;
  margin-top:22px
}

.stat-card {
  border:1px solid var(--line);
  background:var(--paper);
  padding:18px 21px;
  border-radius:19px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px
}

.stat-label {
  font-size:11px;
  font-weight:760;
  color:#899587
}

.stat-value {
  font-size:30px;
  font-weight:850;
  letter-spacing:-1px;
  line-height:1.1;
  margin:6px 0 0
}

.stat-hint {
  font-size:10px;
  color:#97a297;
  margin-top:4px
}

.stat-symbol {
  width:45px;
  height:45px;
  border-radius:15px;
  background:#edf1e9;
  display:grid;
  place-items:center;
  font-size:23px
}

.stat-symbol.gold {
  background:#fff0d9
}

.stat-symbol.pink {
  background:#f9eced
}


.two-col {
  display:grid;
  grid-template-columns:minmax(0,1.65fr) minmax(275px,.95fr);
  gap:22px;
  align-items:stretch
}

.surface {
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:var(--shadow)
}

.daily-card {
  padding:25px 27px;
  display:flex;
  flex-direction:column;
  gap:15px;
  min-height:226px
}

.daily-visual {
  display:grid;
  grid-template-columns:60px 1fr;
  gap:13px;
  align-items:center
}

.daily-emoji {
  height:60px;
  width:60px;
  border-radius:17px;
  background:#f5ead6;
  display:grid;
  place-items:center;
  font-size:32px
}

.daily-card h3,.feature-card h3 {
  font:normal 24px/1.25 var(--serif);
  margin:4px 0 4px
}

.daily-card p,.feature-card p {
  margin:0;
  color:#778377;
  font-size:12px;
  line-height:1.65
}

.daily-bottom {
  margin-top:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px
}

.small-label {
  font-size:11px;
  font-weight:850;
  color:#79917d;
  text-transform:uppercase;
  letter-spacing:1px
}

.feature-card {
  background:#f0efe2;
  border:1px solid #eae7d8;
  min-height:220px;
  border-radius:22px;
  padding:27px;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden
}

.feature-card:after {
  content:'✳';
  color:#d6ddc3;
  position:absolute;
  font-size:180px;
  right:-15px;
  bottom:-85px;
  line-height:1;
  pointer-events:none
}

.feature-card>* {
  position:relative;
  z-index:1
}

.feature-card h3 {
  max-width:210px
}

.feature-card p {
  max-width:230px;
  margin:8px 0 16px
}

.feature-card .btn {
  margin-top:auto;
  align-self:flex-start
}


.aroma-grid {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:16px
}

.aroma-card {
  background:#fffefa;
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  position:relative;
  transition:box-shadow .2s,transform .2s,border-color .2s;
  cursor:pointer;
  text-align:left;
  display:flex;
  flex-direction:column;
  min-height:230px
}

.aroma-card:hover {
  transform:translateY(-3px);
  box-shadow:0 14px 28px rgba(31,65,46,.09);
  border-color:#d7dfce
}

.aroma-art {
  height:132px;
  display:grid;
  place-items:center;
  position:relative;
  overflow:hidden;
  background:var(--tile)
}

.aroma-art:before {
  content:'';
  position:absolute;
  left:50%;
  top:50%;
  width:155px;
  height:155px;
  border:1px solid rgba(255,255,255,.8);
  border-radius:50%;
  transform:translate(-50%,-50%)
}

.aroma-art:after {
  content:'';
  position:absolute;
  left:50%;
  top:50%;
  width:105px;
  height:105px;
  border:1px solid rgba(255,255,255,.8);
  border-radius:50%;
  transform:translate(-50%,-50%)
}

.aroma-emoji {
  font-size:62px;
  position:relative;
  z-index:1;
  filter:drop-shadow(0 7px 5px rgba(0,0,0,.06))
}

.card-bookmark {
  position:absolute;
  top:10px;
  right:10px;
  width:28px;
  height:28px;
  border:0;
  background:rgba(255,255,255,.86);
  border-radius:9px;
  display:grid;
  place-items:center;
  z-index:2;
  color:#829084
}

.card-bookmark.saved {
  color:#ca8154
}

.card-bookmark svg {
  width:16px;
  height:16px
}

.aroma-card-body {
  padding:15px 16px 17px
}

.aroma-card-kicker {
  color:#96a095;
  text-transform:uppercase;
  font-size:9px;
  letter-spacing:1.4px;
  font-weight:850
}

.aroma-card h3 {
  font-size:17px;
  letter-spacing:-.4px;
  margin:4px 0 5px
}

.aroma-card p {
  font-size:11px;
  color:#869188;
  line-height:1.5;
  margin:0
}

.aroma-card-bottom {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:11px;
  gap:6px
}

.molecule-chip {
  background:#f4f6ef;
  color:#738672;
  padding:5px 7px;
  border-radius:6px;
  font-size:9px;
  font-weight:740;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.discovered-check {
  color:#548864;
  font-size:11px;
  display:inline-flex;
  align-items:center;
  gap:3px
}

.discovered-check svg {
  width:14px;
  height:14px
}


.tools-bar {
  display:flex;
  flex-direction:column;
  gap:16px;
  margin-bottom:22px
}

.search-row {
  display:flex;
  align-items:center;
  gap:12px
}

.search-box {
  position:relative;
  flex:1
}

.search-box svg {
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  width:18px;
  height:18px;
  color:#8f9b91
}

.search-input {
  display:block;
  width:100%;
  height:48px;
  border:1px solid var(--line);
  background:#fffefa;
  border-radius:13px;
  padding:0 14px 0 45px;
  color:var(--ink);
  outline:none
}

.search-input:focus {
  border-color:#6f927d
}

.search-input::placeholder {
  color:#9fa9a0
}

.filter-row {
  display:flex;
  gap:8px;
  overflow:auto;
  padding-bottom:4px;
  scrollbar-width:thin
}

.filter-pill {
  border:1px solid #e1e8dd;
  background:#fffefa;
  padding:9px 13px;
  white-space:nowrap;
  border-radius:20px;
  color:#708175;
  font-size:12px;
  font-weight:720
}

.filter-pill:hover {
  border-color:#bfd2bd
}

.filter-pill.selected {
  background:var(--primary);
  color:white;
  border-color:var(--primary)
}

.filter-pill span {
  margin-right:5px
}

.result-info {
  font-size:12px;
  color:#7b887c;
  padding:0 1px 3px
}

.empty-state {
  background:#fffefa;
  border:1px dashed #d3ddcf;
  border-radius:22px;
  padding:44px 25px;
  text-align:center;
  grid-column:1/-1
}

.empty-state .big {
  font-size:49px
}

.empty-state h3 {
  font:normal 26px var(--serif);
  margin:10px 0
}

.empty-state p {
  color:var(--muted);
  max-width:440px;
  margin:0 auto 20px;
  font-size:13px
}


.category-grid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:13px
}

.category-tile {
  min-height:120px;
  position:relative;
  padding:18px;
  border:1px solid var(--line);
  border-radius:17px;
  text-align:left;
  color:var(--ink);
  overflow:hidden
}

.category-tile:hover {
  transform:translateY(-2px)
}

.category-tile .cat-emoji {
  font-size:30px;

.category-tile strong {

.category-tile small {

.quiz-modes {

.mode-card {

  align-items:flex-start;

  border-radius:15px;
  height:58px;
  width:58px;
  display:grid;
  place-items:center;
  font-size:27px
}

.mode-card h3 {
  font:normal 24px var(--serif);
  margin:4px 0 -7px
}

.mode-card p {
  color:var(--muted);

.mode-meta {

  font-weight:750
}

.mode-cta {

}

.quiz-panel {
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:25px;
  padding:34px;
  max-width:800px;
  margin:auto
}

.quiz-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:17px
}

.quiz-count {

  font-weight:780
}

.progress-track {
  height:8px;
  background:#e8eee4;
  border-radius:20px;
  overflow:hidden
}

.progress-fill {
  height:100%;
  background:#7da77a;
  border-radius:20px;
  transition:width .25s
}

.question-kicker {
  font-size:11px;
  color:#86a082;
  text-transform:uppercase;
  letter-spacing:1.35px;
  font-weight:850;
  margin-top:30px
}

.quiz-question {
  font:normal 32px/1.22 var(--serif);
  max-width:650px;
  margin:11px 0 25px
}

.quiz-choices {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px
}

.choice {
  background:#f7f8f3;
  border:1px solid #e3e9e0;
  border-radius:14px;
  padding:16px;
  text-align:left;
  display:flex;
  align-items:center;
  gap:11px;
  min-height:65px;
  color:#34483a;
  font-weight:750
}

.choice:hover:not(:disabled) {
  border-color:#b7cdb6;
  background:#f1f5ed
}

.choice-letter {
  height:31px;
  width:31px;
  flex:none;
  border-radius:10px;
  background:#e5ede0;
  display:grid;
  place-items:center;
  font-size:12px
}

.choice.correct {
  background:#edf5e8;
  border-color:#7eb08b
}

.choice.wrong {
  background:#fff0e9;
  border-color:#dca486
}

.choice:disabled {
  opacity:1
}

.choice.correct .choice-letter {
  background:#d1e5cd
}

.choice.wrong .choice-letter {
  background:#f8d6c8
}

.answer-panel {
  margin-top:22px;
  border-radius:15px;
  padding:18px;
  background:#f1f6eb;
  border:1px solid #dce8d3
}

.answer-panel.wrong {
  background:#fff4ee;
  border-color:#f0ded3
}

.answer-panel strong {
  display:block;
  margin-bottom:6px
}

.answer-panel p {
  font-size:13px;
  color:#6c796e;
  margin:0;
  line-height:1.7
}

.answer-actions {
  display:flex;
  justify-content:flex-end;
  margin-top:17px
}

.quiz-result {
  text-align:center;
  padding:40px 15px
}

.quiz-result .trophy {

}

.quiz-result h2 {
  font:normal 43px var(--serif);
  margin:14px 0
}

.quiz-result p {
  color:var(--muted);
  max-width:450px;
  margin:10px auto 24px
}

.result-number {
  font-size:61px;
  font-weight:850;
  color:var(--primary);
  line-height:1
}

.result-number span {
  font-size:23px;
  color:#9aa99c
}

.result-buttons {
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap
}


.collection-top {
  background:#e8efe3;
  border:1px solid #e0eadd;

}

}

.collection-top p {

  color:#607362;

  margin:0
}

.round-meter {
  flex:none;

  height:124px;
  border-radius:50%;

  display:grid;
  place-items:center
}

.meter-inner {
  border-radius:50%;
  background:#e8efe3;
  width:104px;
  height:104px;
  display:grid;
  place-items:center;
  align-content:center
}

.meter-inner strong {
  font-size:27px
}

.meter-inner span {
  font-size:10px;
  color:#7c917e
}

.achievement-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px
}

.achievement {
  background:#fffefa;
  border:1px solid var(--line);
  border-radius:16px;
  padding:17px;

  gap:11px;
  align-items:center;
  opacity:.55
}

.achievement.earned {

  background:#fffefa
}

.achievement-icon {

  height:46px;

  border-radius:15px;
  background:#f3efdd;

  place-items:center;

}

.achievement strong {
  font-size:12px;

}

.achievement span {
  font-size:10px;
  color:var(--muted)
}

.section-note {

  color:#637563;

}


.about-layout {

  gap:20px
}

.about-card {

}

.about-card p,.about-card li {

}

.about-card ul {
  padding-left:18px
}

.source-item {

}

.source-item:last-child {

}

.source-item a {

  font-weight:790;
  text-decoration:none
}

.source-item p {
  font-size:11px;
  margin:3px 0
}

.about-info {
  background:#eaf0e4;
  border-radius:16px;
  padding:19px;
  margin-top:20px
}

.about-info strong {
  font-size:13px
}

.about-info p {
  font-size:12px;

}


.modal-backdrop {

  inset:0;
  background:rgba(15,38,26,.58);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;

.modal {

  top:-85px;

}

.modal-feature small {

.detail-columns {

  height:16px

.detail-block p {

  color:#748274;

  margin:0
}

  border:1px solid #f3e7ce

  font-size:12px;

}

.insight p {

  margin:0
}

  font-size:13px;

  margin:0
}

.note-area {

.modal-actions {

.modal-sources {

  color:#87948a

.modal-sources a {
  margin:5px 8px 5px 0;

  text-decoration:underline
}

.toast {
  position:fixed;
  z-index:150;
  bottom:28px;
  left:50%;

  background:#1f4735;
  color:#fff;
  padding:13px 20px;
  border-radius:13px;
  font-size:12px;
  font-weight:700;
  box-shadow:0 10px 30px #0003;
  pointer-events:none

.bottom-nav {

.mobile-logo {

.footer-note {

  border:0;
  background:none;
  color:#66836e;
  font-size:inherit;
  text-decoration:underline

 phénols volatils","Les lactones","Les alcools en C6","Les terpénols"],"why":"Ces molécules sont des phénols volatils associés à certains caractères de Brettanomyces.","refs":["brett2017"],"topic":"vin","difficulty":"expert","mode":"science"},{"id":"concept-11","question":"Dans certains vins de Sauvignon blanc, quel groupe de molécules contribue à des notes tropicales ?","answer":"Les thiols variétaux","options":["Les thiols variétaux","Les chlorophénols","Les pyrazines de malt","Les sucres seuls"],"why":"Des thiols volatils comme le 3MH peuvent participer à des notes de fruits exotiques ou d’agrumes.","refs":["thiols2018","grape2014"],"topic":"vin","difficulty":"intermediaire","mode":"science"},{"id":"concept-12","question":"Quelle molécule est connue pour sa contribution aux notes de poivre noir dans certains vins ?","answer":"La rotundone","options":["La rotundone","Le diacétyle","L’acétaldéhyde","Le TCA"],"why":"La rotundone est un sesquiterpène associé à la note poivrée de certains vins.","refs":["grape2014"],"topic":"vin","difficulty":"expert","mode":"science"},{"id":"concept-13","question":"Quelle grande catégorie chimique comprend la vanilline ?","answer":"Les aldéhydes aromatiques","options":["Les aldéhydes aromatiques","Les esters acétiques","Les alcools supérieurs","Les composés azotés"],"why":"La vanilline est un aldéhyde aromatique ; des apports du bois peuvent favoriser sa présence dans certaines boissons élevées.","refs":["oak2020"],"topic":"commun","difficulty":"intermediaire","mode":"science"},{"id":"concept-14","question":"Dans une bière, quel ingrédient contribue directement à de nombreux arômes résineux et floraux ?","answer":"Le houblon","options":["Le houblon","L’étiquette","Le verre de service","Le dioxyde de carbone seul"],"why":"Les huiles essentielles du houblon comprennent notamment des terpènes associés à des impressions résineuses ou florales.","refs":["hop1981","beer2025"],"topic":"biere","difficulty":"debutant","mode":"science"},{"id":"concept-15","question":"Pourquoi ne peut-on pas prévoir l’odeur globale d’un vin à partir d’une seule molécule ?","answer":"À cause des interactions et de la matrice","options":["À cause des interactions et de la matrice","Parce que tous les composés sont inodores","Parce que la chimie ne concerne pas le vin","Parce que le verre neutralise toujours les odeurs"],"why":"Les effets de concentration, les interactions entre odorants et la matrice modifient la perception sensorielle.","refs":["wine2011"],"topic":"commun","difficulty":"intermediaire","mode":"science"},{"id":"concept-16","question":"Que peut évoquer la méthoxypyrazine IBMP dans certains raisins et vins ?","answer":"Le poivron vert","options":["Le poivron vert","La banane mûre","Le pain grillé","Le beurre"],"why":"L’IBMP peut contribuer aux notes végétales de type poivron vert.","refs":["ibmp2010","grape2014"],"topic":"vin","difficulty":"intermediaire","mode":"science"},{"id":"concept-17","question":"Quel composé est souvent cité pour la note « pétrole » de certains Rieslings évolués ?","answer":"Le TDN","options":["Le TDN","Le maltol","Le myrcène","Le furfural"],"why":"Le TDN est un norisoprénoïde associé à la note pétrole dans certains Rieslings ; sa présence varie selon les vins.","refs":["tdn2024"],"topic":"vin","difficulty":"expert","mode":"science"},{"id":"concept-18","question":"À quelle famille le β-caryophyllène appartient-il ?","answer":"Aux sesquiterpènes","options":["Aux sesquiterpènes","Aux esters","Aux acides carboxyliques","Aux lactones"],"why":"Le β-caryophyllène est un sesquiterpène présent parmi les composés du houblon.","refs":["hop1981","beer2025"],"topic":"biere","difficulty":"expert","mode":"science"},{"id":"concept-19","question":"La formation de certaines notes de pain grillé et de malt torréfié peut impliquer…","answer":"Les réactions de Maillard","options":["Les réactions de Maillard","La seule photosynthèse","La clarification au froid","Le CO₂ seul"],"why":"Les réactions de Maillard produisent divers composés odorants, notamment lors de la transformation thermique des malts.","refs":["malt2022"],"topic":"biere","difficulty":"intermediaire","mode":"science"},{"id":"concept-20","question":"Quel composé peut être associé à une note de curry/noix lors de l’évolution de certaines bières ?","answer":"Le sotolon","options":["Le sotolon","Le géraniol","Le limonène","Le DMS"],"why":"Le sotolon est décrit dans des études portant sur des arômes d’évolution, avec des nuances curry/noix.","refs":["sotolon2015"],"topic":"biere","difficulty":"expert","mode":"science"},{"id":"concept-21","question":"Quelle étape est directement concernée par la production d’alcools supérieurs d’origine levurienne ?","answer":"La fermentation","options":["La fermentation","Le lavage des verres","La pose des étiquettes","La mise en carton seule"],"why":"Le métabolisme levurien produit des alcools supérieurs dans le vin et la bière.","refs":["beer2014","wine2011"],"topic":"commun","difficulty":"debutant","mode":"science"},{"id":"concept-22","question":"Dans la bière, quelle famille de composés est souvent liée aux notes fruitées produites par les levures ?","answer":"Les esters","options":["Les esters","Les seuls minéraux","Les protéines insolubles","Les pigments seuls"],"why":"De nombreux esters participent au caractère fruité de bières fermentées.","refs":["beer2014"],"topic":"biere","difficulty":"debutant","mode":"science"},{"id":"concept-23","question":"Dans le vin, le 1,8-cinéole peut évoquer…","answer":"L’eucalyptus","options":["L’eucalyptus","Le beurre","La banane","Le carton humide"],"why":"Le 1,8-cinéole a été étudié comme contributeur possible à certaines notes mentholées/eucalyptus.","refs":["cineole2017"],"topic":"vin","difficulty":"intermediaire","mode":"science"},{"id":"concept-24","question":"Quel composé contribue parfois aux notes de noix de coco d’un élevage en chêne ?","answer":"Une lactone du chêne","options":["Une lactone du chêne","Une méthoxypyrazine","Du DMS","Le chlorophénol"],"why":"Des lactones du chêne, souvent appelées whiskylactones, sont associées à des notes de noix de coco.","refs":["oak2020"],"topic":"vin","difficulty":"intermediaire","mode":"science"},{"id":"concept-25","question":"Un composé « odorant » est-il nécessairement perceptible dans chaque vin où il est mesuré ?","answer":"Non, pas nécessairement","options":["Non, pas nécessairement","Oui, toujours","Uniquement en vin blanc","Uniquement si le vin est jeune"],"why":"La contribution sensorielle dépend notamment de la concentration, des interactions et de la matrice.","refs":["wine2011","grape2014"],"topic":"commun","difficulty":"expert","mode":"science"},{"id":"concept-26","question":"Quel composé est fréquemment associé aux notes d’œuf pourri lors de défauts de fermentation ?","answer":"Le sulfure d’hydrogène (H₂S)","options":["Le sulfure d’hydrogène (H₂S)","Le linalol","La vanilline","Le maltol"],"why":"Le H₂S peut entraîner une déviation soufrée évoquant l’œuf pourri.","refs":["beer2025","wine2011"],"topic":"commun","difficulty":"debutant","mode":"science"},{"id":"concept-27","question":"Quel type de document est le plus adapté pour justifier une association chimique en œnologie ?","answer":"Une étude analytique et sensorielle documentée","options":["Une étude analytique et sensorielle documentée","Une publicité non sourcée","Une note de dégustation isolée comme preuve absolue","Une opinion sans méthode"],"why":"Le lien entre composition et perception se démontre plus solidement avec des méthodes analytiques et sensorielles documentées.","refs":["grape2014","wine2011"],"topic":"commun","difficulty":"expert","mode":"science"},{"id":"concept-28","question":"Quel composé est souvent associé à une déviation de type « solvant/vernis » lorsqu’il est trop présent ?","answer":"L’acétate d’éthyle","options":["L’acétate d’éthyle","La β-ionone","Le géraniol","La rotundone"],"why":"L’acétate d’éthyle peut évoquer le solvant à concentration élevée ; à faible niveau, les esters peuvent contribuer au bouquet.","refs":["beer2025","ucdester"],"topic":"commun","difficulty":"intermediaire","mode":"science"},{"id":"concept-29","question":"Quelle famille de molécules compte le géraniol et le linalol ?","answer":"Les monoterpénols","options":["Les monoterpénols","Les pyrazines","Les dicétones vicinales","Les haloanisoles"],"why":"Le géraniol et le linalol sont deux composés de la famille des monoterpénols.","refs":["grape2014","hop1981"],"topic":"commun","difficulty":"intermediaire","mode":"science"},{"id":"concept-30","question":"Quel composé peut participer aux caractères de rose dans certaines fermentations ?","answer":"L’acétate de 2-phényléthyle","options":["L’acétate de 2-phényléthyle","Le TCA","Le DMS","Le trans-2-nonénal"],"why":"L’acétate de 2-phényléthyle est un ester décrit pour des notes florales, dont la rose.","refs":["beer2014","wine2021"],"topic":"commun","difficulty":"expert","mode":"science"},{"id":"concept-31","question":"Dans un vin, quels facteurs contribuent à la composition aromatique finale ?","answer":"Le raisin, les fermentations et le vieillissement","options":["Le raisin, les fermentations et le vieillissement","La couleur de la contre-étiquette seule","La forme du bouchon seule","La marque du verre seul"],"why":"Plusieurs étapes et facteurs interviennent dans la composition aromatique, du raisin jusqu’à la conservation.","refs":["grape2014","wine2011"],"topic":"vin","difficulty":"debutant","mode":"science"},{"id":"concept-32","question":"Quel composé peut participer à une note de fruit de la passion dans certains Sauvignon blanc ?","answer":"Le 3-mercaptohexan-1-ol (3MH)","options":["Le 3-mercaptohexan-1-ol (3MH)","Le TCA","Le diacétyle","Le DMS"],"why":"Le 3MH est un thiol variétal associé à certaines notes tropicales selon la concentration et la matrice.","refs":["thiols2018"],"topic":"vin","difficulty":"debutant","mode":"science"},{"id":"concept-33","question":"Quel composé est décrit pour une note de violette dans certains vins ?","answer":"La β-ionone","options":["La β-ionone","Le MBT","Le DMS","L’acétate d’éthyle"],"why":"La β-ionone, un norisoprénoïde, est un exemple de composé associé à la violette.","refs":["grape2014"],"topic":"vin","difficulty":"debutant","mode":"science"},{"id":"concept-34","question":"Le 4-éthylphénol lié aux caractères Brettanomyces appartient à quelle famille ?","answer":"Aux phénols volatils","options":["Aux phénols volatils","Aux esters","Aux thiols variétaux","Aux lactones"],"why":"Les phénols volatils sont impliqués dans certains caractères phénolés/animaux liés à Brettanomyces.","refs":["brett2017"],"topic":"vin","difficulty":"expert","mode":"science"},{"id":"concept-35","question":"Quel composé est un exemple de phénol volatil pouvant apporter des notes épicées par le bois ?","answer":"L’eugénol","options":["L’eugénol","Le limonène","Le DMS","Le TCA"],"why":"L’eugénol est un phénol volatil décrit parmi les composés aromatiques liés au bois.","refs":["oak2020"],"topic":"vin","difficulty":"expert","mode":"science"},{"id":"concept-36","question":"Quel rôle peut jouer la riboflavine lors de l’apparition d’un défaut de lumière dans la bière ?","answer":"Un rôle de photosensibilisateur","options":["Un rôle de photosensibilisateur","Un rôle exclusif de sucrant","Un rôle de levure de fermentation","Un rôle de conservateur universel"],"why":"La riboflavine intervient dans les réactions photochimiques favorisant la formation de MBT à partir de composés dérivés du houblon.","refs":["beer2025"],"topic":"biere","difficulty":"expert","mode":"science"},{"id":"concept-37","question":"Dans une bière, quel composé est une dicétone vicinale pouvant évoquer le beurre ?","answer":"Le diacétyle","options":["Le diacétyle","Le myrcène","Le géraniol","Le trans-2-nonénal"],"why":"Le diacétyle est la 2,3-butanedione, une dicétone vicinale connue pour sa note de beurre.","refs":["beer2025"],"topic":"biere","difficulty":"expert","mode":"science"}],"truefalse":[{"id":"fact-01","question":"La perception globale d’un arôme dépend aussi de la matrice et des autres molécules.","answer":"Vrai","options":["Vrai","Faux"],"why":"Une concentration mesurée ne suffit pas à prédire à elle seule la sensation perçue.","refs":["wine2011"],"topic":"commun","difficulty":"debutant","mode":"truefalse"},{"id":"fact-02","question":"Toutes les bières possèdent nécessairement un défaut de diacétyle.","answer":"Faux","options":["Vrai","Faux"],"why":"Le diacétyle n’est pas systématiquement un défaut perceptible : sa concentration et le style comptent.","refs":["beer2025"],"topic":"biere","difficulty":"debutant","mode":"truefalse"},{"id":"fact-03","question":"Le houblon peut apporter des composés associés aux notes florales et résineuses.","answer":"Vrai","options":["Vrai","Faux"],"why":"Le houblon renferme des terpènes et autres odorants qui influencent certains profils aromatiques.","refs":["hop1981","beer2025"],"topic":"biere","difficulty":"debutant","mode":"truefalse"},{"id":"fact-04","question":"Une note de poivron vert est parfois associée à l’IBMP dans le vin.","answer":"Vrai","options":["Vrai","Faux"],"why":"L’IBMP est une méthoxypyrazine connue pour ce descripteur végétal.","refs":["ibmp2010"],"topic":"vin","difficulty":"debutant","mode":"truefalse"},{"id":"fact-05","question":"Tous les vins possèdent exactement les mêmes molécules odorantes aux mêmes concentrations.","answer":"Faux","options":["Vrai","Faux"],"why":"La composition évolue avec le cépage, les conditions de culture, la fermentation et le vieillissement.","refs":["grape2014","wine2011"],"topic":"vin","difficulty":"debutant","mode":"truefalse"},{"id":"fact-06","question":"Les levures interviennent dans la formation d’une partie des esters aromatiques.","answer":"Vrai","options":["Vrai","Faux"],"why":"Le métabolisme de fermentation participe à la synthèse d’esters fruités.","refs":["beer2014","wine2011"],"topic":"commun","difficulty":"debutant","mode":"truefalse"},{"id":"fact-07","question":"Le linalol est un composé de la famille des monoterpénols.","answer":"Vrai","options":["Vrai","Faux"],"why":"Il s’agit d’un terpénol associé à des impressions florales dans certains profils.","refs":["grape2014"],"topic":"commun","difficulty":"intermediaire","mode":"truefalse"},{"id":"fact-08","question":"Le TCA est le nom d’un ester fruité caractéristique des bananes.","answer":"Faux","options":["Vrai","Faux"],"why":"Le TCA est un haloanisole connu pour des notes de bouchon ou de moisi.","refs":["cork2023"],"topic":"vin","difficulty":"intermediaire","mode":"truefalse"},{"id":"fact-09","question":"Les whiskylactones peuvent contribuer aux notes de noix de coco du bois.","answer":"Vrai","options":["Vrai","Faux"],"why":"Des lactones du chêne présentent des nuances pouvant évoquer la noix de coco.","refs":["oak2020"],"topic":"vin","difficulty":"intermediaire","mode":"truefalse"},{"id":"fact-10","question":"Le MBT associé à un défaut de lumière dans la bière est un thiol volatil.","answer":"Vrai","options":["Vrai","Faux"],"why":"Le 3-méthyl-2-butène-1-thiol peut apparaître lors de réactions photochimiques.","refs":["beer2025"],"topic":"biere","difficulty":"expert","mode":"truefalse"},{"id":"fact-11","question":"Le DMS signifie sulfure de diméthyle.","answer":"Vrai","options":["Vrai","Faux"],"why":"Le DMS est un composé soufré qui peut évoquer le maïs cuit.","refs":["beer2025"],"topic":"biere","difficulty":"debutant","mode":"truefalse"},{"id":"fact-12","question":"Le trans-2-nonénal est associé à des notes de carton dans certaines bières vieillies.","answer":"Vrai","options":["Vrai","Faux"],"why":"Cette molécule est un marqueur connu du vieillissement oxydatif de certaines bières.","refs":["nonenal1999","beer2025"],"topic":"biere","difficulty":"intermediaire","mode":"truefalse"},{"id":"fact-13","question":"La β-ionone appartient à la famille des esters acétiques.","answer":"Faux","options":["Vrai","Faux"],"why":"La β-ionone est un norisoprénoïde, associé à des nuances florales/violette.","refs":["grape2014"],"topic":"vin","difficulty":"expert","mode":"truefalse"},{"id":"fact-14","question":"La vanilline peut provenir de l’élevage d’une boisson au contact de bois.","answer":"Vrai","options":["Vrai","Faux"],"why":"L’élevage en fût peut apporter des molécules odorantes comme la vanilline.","refs":["oak2020"],"topic":"commun","difficulty":"debutant","mode":"truefalse"},{"id":"fact-15","question":"L’acide acétique est un alcool supérieur.","answer":"Faux","options":["Vrai","Faux"],"why":"L’acide acétique est un acide carboxylique volatil.","refs":["wine2011","beer2025"],"topic":"commun","difficulty":"intermediaire","mode":"truefalse"},{"id":"fact-16","question":"La rotundone est associée à des notes de poivre noir dans certains vins.","answer":"Vrai","options":["Vrai","Faux"],"why":"Cette contribution a été rapportée pour ce sesquiterpène.","refs":["grape2014"],"topic":"vin","difficulty":"intermediaire","mode":"truefalse"},{"id":"fact-17","question":"Les pyrazines participent à certaines notes grillées des malts.","answer":"Vrai","options":["Vrai","Faux"],"why":"Des pyrazines sont formées notamment lors de processus thermiques liés au maltage/torréfaction.","refs":["malt2022"],"topic":"biere","difficulty":"intermediaire","mode":"truefalse"},{"id":"fact-18","question":"La fermentation alcoolique ne produit jamais d’alcools supérieurs.","answer":"Faux","options":["Vrai","Faux"],"why":"Les levures peuvent produire des alcools supérieurs pendant la fermentation.","refs":["beer2014","wine2011"],"topic":"commun","difficulty":"debutant","mode":"truefalse"},{"id":"fact-19","question":"Une même note de fruit peut être soutenue par plusieurs composés différents.","answer":"Vrai","options":["Vrai","Faux"],"why":"Les descripteurs olfactifs ne correspondent pas obligatoirement à une seule molécule.","refs":["wine2011"],"topic":"commun","difficulty":"debutant","mode":"truefalse"},{"id":"fact-20","question":"Le 4-éthylphénol et le 4-éthylgaïacol appartiennent aux phénols volatils.","answer":"Vrai","options":["Vrai","Faux"],"why":"Ces molécules font partie des composés associés à certains caractères Brettanomyces.","refs":["brett2017"],"topic":"vin","difficulty":"intermediaire","mode":"truefalse"},{"id":"fact-21","question":"L’acétate d’éthyle est toujours agréable, quelle que soit sa concentration.","answer":"Faux","options":["Vrai","Faux"],"why":"Il peut évoquer le solvant à des concentrations élevées.","refs":["ucdester","beer2025"],"topic":"commun","difficulty":"intermediaire","mode":"truefalse"},{"id":"fact-22","question":"Le sotolon peut évoquer des notes de curry ou de noix.","answer":"Vrai","options":["Vrai","Faux"],"why":"Il a été étudié, entre autres, dans des bières vieillies.","refs":["sotolon2015"],"topic":"biere","difficulty":"expert","mode":"truefalse"},{"id":"fact-23","question":"Les terpènes sont exclusivement des molécules de synthèse, absentes des raisins.","answer":"Faux","options":["Vrai","Faux"],"why":"Les terpènes font partie des familles décrites naturellement dans certains raisins et houblons.","refs":["grape2014","hop1981"],"topic":"commun","difficulty":"debutant","mode":"truefalse"},{"id":"fact-24","question":"Le 3MH est un thiol pouvant contribuer à des notes d’agrumes ou de fruit exotique.","answer":"Vrai","options":["Vrai","Faux"],"why":"Le 3-mercaptohexan-1-ol est impliqué dans certains profils de Sauvignon blanc.","refs":["thiols2018"],"topic":"vin","difficulty":"intermediaire","mode":"truefalse"},{"id":"fact-25","question":"Le TDN peut contribuer à une note pétrole dans certains Rieslings.","answer":"Vrai","options":["Vrai","Faux"],"why":"Il s’agit d’un norisoprénoïde associé à cette note dans certains Rieslings.","refs":["tdn2024"],"topic":"vin","difficulty":"expert","mode":"truefalse"},{"id":"fact-26","question":"On peut s’entraîner à reconnaître la cannelle ou les agrumes sans consommer d’alcool.","answer":"Vrai","options":["Vrai","Faux"],"why":"L’observation olfactive de produits alimentaires du quotidien suffit pour s’exercer.","refs":["wine2011"],"topic":"commun","difficulty":"debutant","mode":"truefalse"},{"id":"fact-27","question":"Le benzaldéhyde est un composé qui peut évoquer l’amande.","answer":"Vrai","options":["Vrai","Faux"],"why":"Le benzaldéhyde présente notamment des nuances d’amande amère.","refs":["malt2022"],"topic":"commun","difficulty":"intermediaire","mode":"truefalse"},{"id":"fact-28","question":"L’oxydation et le temps n’ont aucun effet sur les arômes de bière.","answer":"Faux","options":["Vrai","Faux"],"why":"Des réactions de vieillissement peuvent entraîner la formation ou la modification d’odorants.","refs":["nonenal1999","beer2025"],"topic":"biere","difficulty":"debutant","mode":"truefalse"},{"id":"fact-29","question":"La 2,5-diméthylpyrazine appartient à la famille des pyrazines.","answer":"Vrai","options":["Vrai","Faux"],"why":"Cette structure peut contribuer à certaines nuances grillées dans les malts.","refs":["malt2022"],"topic":"biere","difficulty":"expert","mode":"truefalse"},{"id":"fact-30","question":"Une référence scientifique garantit que le même odorant sera perceptible dans tous les produits.","answer":"Faux","options":["Vrai","Faux"],"why":"Les seuils, concentrations, matrices et interactions diffèrent d’une boisson à l’autre.","refs":["wine2011"],"topic":"commun","difficulty":"expert","mode":"truefalse"},{"id":"fact-31","question":"L’acétaldéhyde peut être associé à une impression de pomme verte.","answer":"Vrai","options":["Vrai","Faux"],"why":"L’acétaldéhyde est décrit parmi les molécules pouvant évoquer la pomme verte.","refs":["beer2025"],"topic":"commun","difficulty":"intermediaire","mode":"truefalse"},{"id":"fact-32","question":"L’eugénol est un phénol volatil associé à des notes épicées.","answer":"Vrai","options":["Vrai","Faux"],"why":"L’eugénol est notamment décrit dans les apports aromatiques de certains bois.","refs":["oak2020"],"topic":"vin","difficulty":"expert","mode":"truefalse"},{"id":"fact-33","question":"Le 1,8-cinéole est forcément le composant majoritaire de tout vin rouge.","answer":"Faux","options":["Vrai","Faux"],"why":"Sa présence varie fortement et sa contribution n’est pas universelle.","refs":["cineole2017"],"topic":"vin","difficulty":"expert","mode":"truefalse"},{"id":"fact-34","question":"Les arômes d’un vin dépendent notamment de la matière première et des transformations microbiennes.","answer":"Vrai","options":["Vrai","Faux"],"why":"Le raisin, les micro-organismes, l’élevage et les conditions de conservation influencent le bouquet.","refs":["wine2011","grape2014"],"topic":"vin","difficulty":"debutant","mode":"truefalse"},{"id":"fact-35","question":"Le diacétyle est une dicétone vicinale.","answer":"Vrai","options":["Vrai","Faux"],"why":"Le 2,3-butanedione fait partie des dicétones vicinales.","refs":["beer2025"],"topic":"biere","difficulty":"expert","mode":"truefalse"},{"id":"fact-36","question":"Le myrcène est un terpène que l’on peut retrouver parmi les composés du houblon.","answer":"Vrai","options":["Vrai","Faux"],"why":"Le myrcène est un monoterpène associé à des nuances résineuses/herbacées.","refs":["hop1981","beer2025"],"topic":"biere","difficulty":"intermediaire","mode":"truefalse"}]};
</script>
<script>
(() => {
  'use strict';
  const DB = window.AROMALAB_DATA;
  if (!DB || !Array.isArray(DB.aromas)) throw new Error('Contenu AromaLab manquant');
  const aromes = DB.aromas;
  const categories = DB.categories;
  const findAroma = id => aromes.find(a => a.id === id);
  const findCat = id => categories.find(c => c.id === id);
  const app = document.getElementById('app');
  const STORAGE_KEY = 'aromalab-saves-v1';
  const emptyStore = () => ({discovered:[], favorites:[], notes:{}, results:[], daily:{}});
  const safeString = x => String(x ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const safeLoad = () => {
    try {
      const s = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      return {
        discovered: Array.isArray(s.discovered) ? s.discovered.filter(x => findAroma(x)) : [],
        favorites: Array.isArray(s.favorites) ? s.favorites.filter(x => findAroma(x)) : [],
        notes: s.notes && typeof s.notes === 'object' && !Array.isArray(s.notes) ? s.notes : {},
        results: Array.isArray(s.results) ? s.results.slice(-80) : [],
        daily: s.daily && typeof s.daily === 'object' && !Array.isArray(s.daily) ? s.daily : {}
      };
    } catch {return emptyStore();}
  };
  let saved = safeLoad();
  let state = {page:'home', filter:'all', search:'', quiz:null, modal:null};
  // Banque 1.3 : 120 associations dérivées des fiches + exercices conceptuels sourcés.
  // Chaque Q dispose d'une référence, d'une difficulté et d'un thème.
  const quizBonus = window.AROMALAB_QUIZ_BONUS || {mcqs:[],truefalse:[]};
  const difficultyLabels={debutant:'Découverte',intermediaire:'Intermédiaire',expert:'Expert'};
  const topicLabels={commun:'Vin & bière',vin:'Vin',biere:'Bière'};
  const diffValues=['debutant','intermediaire','expert'];
  const rand=(items)=>{const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const chooseDistractors=(items, field, main, count=3)=> {
    const set=new Set([main]); const result=[];
    for (const a of items) {const val=a[field];if(!set.has(val)){set.add(val);result.push(val);if(result.length===count)break;}}
    return result;
  };
  const bank=[];
  aromes.forEach((a,i)=>{
    const other=aromes.filter(o=>o.id!==a.id&&o.molecule!==a.molecule);
    const tier=diffValues[i%3];
    const shuffled=rand(other);
    const alt=chooseDistractors(shuffled,'name',a.name);
    const altMol=chooseDistractors(shuffled,'molecule',a.molecule);
    bank.push({id:`ar-${a.id}`,mode:'aroma',difficulty:tier,topic:'commun',question:`Parmi ces notes, laquelle est notamment associée à « ${a.molecule} » dans AromaLab ?`,answer:a.name,options:rand([a.name,...alt]),why:a.insight+' Cette association est indicative : plusieurs molécules contribuent souvent à une même odeur.',refs:a.sources,aromaId:a.id});
    bank.push({id:`mo-${a.id}`,mode:'molecule',difficulty:diffValues[(i+1)%3],topic:'commun',question:`Quel composé est présenté comme exemple pour la note « ${a.name} » ?`,answer:a.molecule,options:rand([a.molecule,...altMol]),why:a.insight+' La contribution perceptible dépend de la concentration et de la matrice.',refs:a.sources,aromaId:a.id});
  });
  bank.push(...quizBonus.mcqs,...quizBonus.truefalse);
  // On conserve les 16 vrai/faux historiques afin de préserver la variété des défis.
  const archiveRefs=[['beer2014'],['oak2020'],['grape2014','hop1981'],['beer2025'],['wine2011'],['beer2025'],['wine2011'],['grape2014'],['hop1981'],['beer2025'],['thiols2018'],['grape2014'],['oak2020'],['wine2011'],['wine2011'],['beer2014']];
  DB.trueFalse.forEach((item,i)=>bank.push({id:`archive-${i}`,mode:'truefalse',difficulty:diffValues[i%3],topic:'commun',question:item.statement,answer:item.answer?'Vrai':'Faux',options:['Vrai','Faux'],why:item.why,refs:archiveRefs[i]}));
  const totalQuestions=bank.length;
  const validBank=bank.filter(q=>q.options.includes(q.answer)&&new Set(q.options).size===q.options.length&&Array.isArray(q.refs)&&q.refs.every(id=>DB.sources.some(s=>s.id===id)));
  if(validBank.length!==totalQuestions) throw new Error('Questions AromaLab invalides : '+(totalQuestions-validBank.length));
  state.settings={difficulty:'toutes',theme:'mixte'};
  const quizSources=refs=>{const ids=[...new Set(refs||[])];const links=ids.slice(0,3).map(id=>{const s=DB.sources.find(x=>x.id===id);return s?`<a href="${safeString(s.url)}" target="_blank" rel="noopener noreferrer">${safeString(s.title.split(' — ')[0])} ↗</a>`:'';}).filter(Boolean).join('');return links?`<div class="answer-references"><strong>📚 Sources :</strong>${links}</div>`:'';};
  const quizFilter=q=>(state.settings.difficulty==='toutes'||q.difficulty===state.settings.difficulty)&&(state.settings.theme==='mixte'||q.topic===state.settings.theme||q.topic==='commun');
  const scoreMultiplier=q=>({debutant:15,intermediaire:25,expert:40}[q.difficulty]||15);
  const quizXP=q=>q.items.slice(0,q.idx+1).reduce((n,item,i)=>n+((q.answers||[])[i]===item.answer?scoreMultiplier(item):0),0);
  const avgPercent=()=>saved.results.length?Math.round(100*saved.results.reduce((s,r)=>s+(Number(r.score)||0),0)/Math.max(1,saved.results.reduce((s,r)=>s+(Number(r.total)||8),0))):0;
  const nextLevelPoints=()=>180-(totalScore()%180);
  const currentStreak=()=>{const played=new Set(Object.keys(saved.daily).filter(k=>saved.daily[k]));const now=new Date();now.setHours(12,0,0,0);let count=0;for(let i=0;i<366;i++){const key=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;if(!played.has(key)){if(i===0){now.setDate(now.getDate()-1);continue;}break;}count++;now.setDate(now.getDate()-1);}return count;};

  let deferredInstall = null;
  const persist = () => {try {localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));} catch {notify('Stockage indisponible : tes données ne seront pas conservées.');}};
